packages:
  - type: github_release
    repo_owner: boxp
    repo_name: ansible-plan-formatter
    asset: ansible-plan-formatter_{{.OS}}_{{.Arch}}.tar.gz
    supported_envs:
      - linux/amd64
    files:
      - name: ansible-plan-formatter

  # Temporary copy from aqua-registry 3546ea19be0d0f225b5e97719e82a6cb802bd2b1.
  # Preserve legacy overrides; v6.4.2+ publishes a Sigstore bundle.
  # Remove after upstream supports the bundle (BOXP-327).
  - type: github_release
    repo_owner: suzuki-shunsuke
    repo_name: github-comment
    description: CLI to create and hide GitHub comments
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 4.3.0-0")
        asset: github-comment_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: github_release
          asset: github-comment_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 5.0.0")
        asset: github-comment_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: github-comment_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 5.0.1")
        asset: github-comment_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: github-comment_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: github_release
          asset: multiple.intoto.jsonl
      - version_constraint: semver("<= 6.4.1")
        asset: github-comment_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        slsa_provenance:
          type: github_release
          asset: multiple.intoto.jsonl
        checksum:
          type: github_release
          asset: github-comment_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --signature
              - https://github.com/suzuki-shunsuke/github-comment/releases/download/{{.Version}}/github-comment_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://github.com/suzuki-shunsuke/github-comment/releases/download/{{.Version}}/github-comment_{{trimV .Version}}_checksums.txt.pem
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/github-comment
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: "true"
        asset: github-comment_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: github_release
          asset: github-comment_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: github_release
              asset: github-comment_{{trimV .Version}}_checksums.txt.sigstore.json
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.+$"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/github-comment
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
