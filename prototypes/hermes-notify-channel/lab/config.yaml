# BOXP-546 lab only. The model is the scripted stub on loopback; nothing here reaches production.
model:
  provider: custom
  default: lab
  model: lab
  base_url: http://127.0.0.1:18080/v1
  api_key: lab
  supports_vision: false
  context_length: 65536

display:
  tool_progress: "new"
  # Official per-platform switch: engine diagnostics ("retrying 1/3 ...") are not sent for webhook turns.
  platforms:
    webhook:
      suppress_warning_notifications: true

plugins:
  enabled:
    - boxp-notify

platform_toolsets:
  webhook:
    - terminal
    - file
