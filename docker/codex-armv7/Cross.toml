# 🚨 musl を使う。gnueabihf は glibc の板挟みになって成立しなかった:
#      新しいイメージ -> glibc 2.38/2.39 に対してリンクされ、実機 (Debian
#                        bookworm / glibc 2.36) で "version `GLIBC_2.38' not
#                        found" となり起動できない
#      古いイメージ   -> ホスト側の glibc が古すぎて aws-lc-sys / zstd-sys の
#                        build script (x86_64 バイナリ) が起動できない
#    musl なら静的リンクになり glibc に一切依存しない。実測で GLIBC 参照 0 件。
[target.armv7-unknown-linux-musleabihf]
pre-build = [
  "apt-get update",
  "apt-get install --assume-yes pkg-config",
]
