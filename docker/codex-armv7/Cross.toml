# ビルドの母体は docker/codex-armv7/Dockerfile で作る自前イメージ。
# 理由は Dockerfile 冒頭のコメントを参照 (glibc の板挟みと rusty_v8 の musl 拒否)。
[target.armv7-unknown-linux-gnueabihf]
image = "is01-cross-armv7:20.04"

[target.armv7-unknown-linux-gnueabihf.env]
passthrough = [
  "V8_FROM_SOURCE",
  # 🚨 壁 9: rusty_v8 の build.rs は GN_ARGS を GN にそのまま渡すが、cross は
  #    明示しない環境変数をコンテナへ渡さない。Temporal (Rust ICU4X) を armv7
  #    だけ無効にする指定をクロスビルド環境まで届ける。
  "GN_ARGS",
  "PKG_CONFIG_ALLOW_CROSS=1",
  "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig",
]
