---
# tasks file for kubernetes_components

- name: Include system preparation tasks
  ansible.builtin.include_tasks: system_preparation.yml

- name: Include CRI-O installation tasks
  ansible.builtin.include_tasks: crio.yml

- name: Include Kubernetes installation tasks
  ansible.builtin.include_tasks: kubernetes.yml

- name: Include kubelet configuration tasks
  ansible.builtin.include_tasks: kubelet.yml

# kubeadm-config.yaml.j2 が apiserver_goaway_chance をそのまま書き出すため、テンプレート生成より前に検証する。
- name: Validate kube-apiserver goaway settings before rendering the kubeadm config
  ansible.builtin.include_tasks: apiserver_goaway_validate.yml

- name: Include kubeadm configuration tasks
  ansible.builtin.include_tasks: kubeadm.yml

- name: Include journald configuration tasks
  ansible.builtin.include_tasks: journald.yml

- name: Include node resilience tasks
  ansible.builtin.include_tasks: node_resilience.yml

- name: Include control plane metrics tasks
  ansible.builtin.include_tasks: control_plane_metrics.yml

- name: Include kube-apiserver goaway (HTTP/2 rebalancing) tasks
  ansible.builtin.include_tasks: apiserver_goaway.yml
