---
# kube-apiserver に --goaway-chance を設定し、HTTP/2 クライアント (watch) を 3 台へ再分散させる。
#
# 背景 (BOXP-225、2026-10-08 実測):
# - apiserver 3 台の同時再起動 (02:07〜02:16 UTC) 後、long-running request (ほぼ watch) が
#   CP1 1,054 / CP2 81 / CP3 518 に偏った。7 日間の推移では毎回「最後に再起動した apiserver が最少、
#   他が肥大」で、再起動が起きるまで偏りは解消しない (HTTP/2 接続は再接続されないため)。
# - apiserver RSS は watch 数と相関 (r=0.65、約 0.73MiB/watch、切片約 1.15GiB)。
#   偏った 1 台では anon が RAM 3.9GiB の約 3.0GiB を占め、ページキャッシュが 260〜800MiB まで縮む。
# - その結果、CP1 の major fault は etcd (bbolt mmap の再読込、平均 11.7/秒・最大 88/秒) が支配的で、
#   eMMC 読み込みが最大 15MB/秒まで跳ね、etcd の slow apply / leader change を誘発していた。
#
# --goaway-chance は要求の指定割合に GOAWAY を返す apiserver 組み込みのフラグで、
# 「HTTP/2 クライアントが単一 apiserver に貼り付くのを防ぐ」ことが唯一の目的 (上流ヘルプ文)。
# 既存の in-flight 要求は影響を受けず、クライアントは LB (kubernetes Service / kube-proxy、
# VIP) を通して再接続する。VIP 直結クライアント (kubelet 等) は同じ VIP 保持者へ戻るだけで害はない。
#
# 変更は control_plane_metrics.yml と同じ二段構え:
#   (1) 稼働中の静的 Pod マニフェストへ冪等に反映する (kubelet が apiserver を再起動する)
#   (2) kube-system/kubeadm-config の ClusterConfiguration にも保存し、次回 kubeadm upgrade で
#       マニフェストが再生成されても消えないようにする
# apiserver は quorum を持たないが、3 台同時に再起動すると API が止まる。
# 直列化の本体は playbooks/control-plane.yml の serial: 1 で、本ファイルの throttle: 1 は補助。

# Ansible の float フィルタは数値でない文字列 ("invalid" 等) を 0.0 にするため、範囲チェックだけでは
# 不正値がマニフェストへそのまま書かれ kube-apiserver が crash-loop する。元の値が 10 進の有限数
# (例: "0", "0.001") であることを先に検証する。指数表記や nan/inf は意図的に拒否する。
- name: Validate the goaway chance is a plain decimal number
  ansible.builtin.assert:
    that:
      - apiserver_goaway_chance | string is match('^[0-9]+(\\.[0-9]+)?$')
    fail_msg: >-
      apiserver_goaway_chance must be a plain decimal number such as "0" or "0.001"
      (it is written verbatim into the kube-apiserver static pod manifest). Got: {{ apiserver_goaway_chance }}
  when:
    - apiserver_goaway_chance_enabled | bool

- name: Validate the goaway chance is within the range kube-apiserver accepts
  ansible.builtin.assert:
    that:
      - apiserver_goaway_chance | float >= 0
      - apiserver_goaway_chance | float <= 0.02
    fail_msg: >-
      apiserver_goaway_chance must be between 0 and 0.02 (kube-apiserver rejects anything else
      and the static pod would crash-loop). Got: {{ apiserver_goaway_chance }}
  when:
    - apiserver_goaway_chance_enabled | bool

- name: Check if the kube-apiserver manifest exists
  ansible.builtin.stat:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: apiserver_manifest
  become: true
  when:
    - apiserver_goaway_chance_enabled | bool
    - inventory_hostname in groups['control_plane'] | default([])

# 以降の変更はマニフェストが存在するノードだけが対象。
- name: Decide whether this node carries a kube-apiserver static pod
  ansible.builtin.set_fact:
    apiserver_goaway_applicable: >-
      {{
        (apiserver_goaway_chance_enabled | bool)
        and (inventory_hostname in groups['control_plane'] | default([]))
        and (apiserver_manifest.stat.exists | default(false))
      }}

- name: Ensure the manifest backup directory exists
  ansible.builtin.file:
    path: /var/backups/kubernetes-manifests
    state: directory
    mode: '0700'
  become: true
  when:
    - apiserver_goaway_applicable | bool

# 静的 Pod ディレクトリ内にバックアップを置くと kubelet がそれも Pod として読むため、外へ退避する。
- name: Keep a pristine copy of the kube-apiserver manifest outside the static pod directory
  ansible.builtin.copy:
    src: /etc/kubernetes/manifests/kube-apiserver.yaml
    dest: /var/backups/kubernetes-manifests/kube-apiserver.yaml.orig
    remote_src: true
    force: false
    mode: '0600'
  become: true
  when:
    - apiserver_goaway_applicable | bool

# 静的 Pod が実際に入れ替わったかを PID の変化で判定するため、変更より先に控える。
- name: Record the running kube-apiserver PID before touching the manifest
  ansible.builtin.command: pgrep -x kube-apiserver
  register: apiserver_pid_before
  changed_when: false
  failed_when: false
  become: true
  when:
    - apiserver_goaway_applicable | bool

- name: Read the kube-apiserver manifest to check for the goaway flag
  ansible.builtin.slurp:
    src: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: apiserver_manifest_raw
  become: true
  when:
    - apiserver_goaway_applicable | bool

# --secure-port は kubeadm が常に出力する行なので、その字下げを流用して直後に追加する。
- name: Add the goaway chance flag when it is missing entirely
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '^(\s*)(- --secure-port=.*)$'
    replace: '\1\2\n\1- --goaway-chance={{ apiserver_goaway_chance }}'
  become: true
  throttle: 1
  register: apiserver_goaway_added
  when:
    - apiserver_goaway_applicable | bool
    - '"--goaway-chance" not in (apiserver_manifest_raw.content | default("") | b64decode)'

- name: Keep an existing goaway chance flag in sync with the declared value
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '^(\s*)- --goaway-chance=.*$'
    replace: '\1- --goaway-chance={{ apiserver_goaway_chance }}'
  become: true
  throttle: 1
  register: apiserver_goaway_synced
  when:
    - apiserver_goaway_applicable | bool
    - '"--goaway-chance" in (apiserver_manifest_raw.content | default("") | b64decode)'

- name: Note whether the kube-apiserver manifest changed
  ansible.builtin.set_fact:
    apiserver_manifest_edited: >-
      {{
        (apiserver_goaway_added.changed | default(false))
        or (apiserver_goaway_synced.changed | default(false))
      }}

# kubelet がマニフェスト変更を検知して apiserver を入れ替えるのは非同期。
# PID が変わる前に readyz を見ると「変更前の apiserver」で即成功し、次のノードへ進んでしまう。
- name: Wait for kubelet to restart the kube-apiserver static pod  # noqa: no-handler
  ansible.builtin.command: pgrep -x kube-apiserver
  register: apiserver_pid_after
  changed_when: false
  failed_when: false
  become: true
  throttle: 1
  until:
    - apiserver_pid_after.stdout | trim | length > 0
    - (apiserver_pid_after.stdout | trim) != (apiserver_pid_before.stdout | default('') | trim)
  retries: 30
  delay: 10
  when:
    - apiserver_manifest_edited | bool
    - ansible_virtualization_type | default('') != "docker"
    - chroot_build is not defined or not chroot_build

- name: Assert the kube-apiserver static pod actually restarted
  ansible.builtin.assert:
    that:
      - apiserver_pid_after.stdout | trim | length > 0
      - (apiserver_pid_after.stdout | trim) != (apiserver_pid_before.stdout | default('') | trim)
    fail_msg: >-
      kube-apiserver static pod did not restart after the manifest change.
      Proceeding to the next node could leave several apiservers restarting at once.
  when:
    - apiserver_manifest_edited | bool
    - ansible_virtualization_type | default('') != "docker"
    - chroot_build is not defined or not chroot_build

# /readyz は system:public-info-viewer により未認証でも読める。
# 証明書検証は行わない (SAN にループバックが含まれる保証がないため)。
- name: Wait for the local kube-apiserver to report ready
  ansible.builtin.uri:
    url: https://127.0.0.1:6443/readyz
    validate_certs: false
    status_code: 200
    return_content: false
  register: apiserver_readyz
  until: apiserver_readyz.status | default(0) == 200
  retries: 60
  delay: 5
  throttle: 1
  when:
    - apiserver_manifest_edited | bool
    - ansible_virtualization_type | default('') != "docker"
    - chroot_build is not defined or not chroot_build

# ここまでは稼働中のマニフェストを直しただけ。kubeadm upgrade apply/node は --config なしで
# kube-system/kubeadm-config の ClusterConfiguration からマニフェストを再生成するため、
# ConfigMap にも保存しないと次回アップグレードでフラグが消える。
# ⚠️ ローカルのテンプレートを upload-config に渡してはいけない (control_plane_metrics.yml 参照)。
#    必ず「稼働中の ClusterConfiguration を読み、必要なキーだけ足して」書き戻す。
# ゲートは admin.conf の有無だけにする (docker / chroot の除外条件を付けない)。
# molecule の apiserver-goaway シナリオは admin.conf と kubectl / kubeadm をモックしてこの経路を通し、
# 既存 apiServer.extraArgs の保持・goaway-chance の追加・2 回目 no-op を CI で検証する。
- name: Check whether this node has an initialized control plane (goaway)
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: apiserver_goaway_admin_conf
  become: true
  run_once: true
  when:
    - apiserver_goaway_applicable | bool

- name: Read the live kubeadm ClusterConfiguration (goaway)
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf
      -n kube-system get cm kubeadm-config -o jsonpath={.data.ClusterConfiguration}
  register: apiserver_goaway_live_cc
  changed_when: false
  become: true
  run_once: true
  when:
    - apiserver_goaway_applicable | bool
    - apiserver_goaway_admin_conf.stat.exists | default(false)

# combine(recursive=True) はリストを置換するため、apiServer.extraArgs の既存要素
# (authorization-mode 等) を残して goaway-chance だけ差し替える。
- name: Build the merged ClusterConfiguration (goaway)
  ansible.builtin.set_fact:
    apiserver_goaway_cc_live: "{{ apiserver_goaway_cc_live_parsed }}"
    apiserver_goaway_cc_merged: >-
      {{
        apiserver_goaway_cc_live_parsed | combine({
          'apiServer': {'extraArgs': apiserver_goaway_cc_args}
        }, recursive=True)
      }}
  vars:
    apiserver_goaway_cc_live_parsed: "{{ apiserver_goaway_live_cc.stdout | from_yaml }}"
    apiserver_goaway_cc_want:
      name: goaway-chance
      value: "{{ apiserver_goaway_chance | string }}"
    apiserver_goaway_cc_args: >-
      {{
        ((apiserver_goaway_live_cc.stdout | from_yaml).apiServer | default({}, true)).extraArgs | default([], true)
        | rejectattr('name', 'equalto', 'goaway-chance') | list + [apiserver_goaway_cc_want]
      }}
  run_once: true
  when:
    - apiserver_goaway_applicable | bool
    - (apiserver_goaway_live_cc.stdout | default('')) | length > 0

- name: Write the merged ClusterConfiguration (goaway)
  ansible.builtin.copy:
    dest: /etc/kubernetes/kubeadm-clusterconfig-goaway-merged.yaml
    mode: '0600'
    content: "{{ apiserver_goaway_cc_merged | to_nice_yaml(indent=2) }}"
  become: true
  run_once: true
  when:
    - apiserver_goaway_cc_merged is defined
    - apiserver_goaway_cc_merged != apiserver_goaway_cc_live

- name: Upload the ClusterConfiguration so kubeadm upgrade keeps the goaway flag
  ansible.builtin.command:
    cmd: kubeadm init phase upload-config kubeadm --config /etc/kubernetes/kubeadm-clusterconfig-goaway-merged.yaml
  become: true
  run_once: true
  changed_when: true
  when:
    - apiserver_goaway_cc_merged is defined
    - apiserver_goaway_cc_merged != apiserver_goaway_cc_live
