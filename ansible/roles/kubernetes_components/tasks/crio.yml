---
# CRI-O installation and configuration tasks

- name: Install dependencies for CRI-O
  ansible.builtin.package:
    name:
      - curl
      - gnupg
      - software-properties-common
      - apt-transport-https
      - ca-certificates
    state: present
  become: true

- name: Add CRI-O repository key
  ansible.builtin.apt_key:
    url: "{{ crio_apt_key_url }}"
    state: present
  become: true

- name: Add CRI-O version-specific repository key
  ansible.builtin.apt_key:
    url: "{{ crio_version_apt_key_url }}"
    state: present
  become: true

- name: Add CRI-O repository
  ansible.builtin.apt_repository:
    repo: "deb {{ crio_apt_repository }} /"
    state: present
    filename: crio
    update_cache: true
  become: true

- name: Add CRI-O version-specific repository
  ansible.builtin.apt_repository:
    repo: "deb {{ crio_version_apt_repository }} /"
    state: present
    filename: crio-version
    update_cache: true
  become: true

# BOXP-222: crio_version は apt repo の major.minor を決めるだけで、実際に入る deb 版は決めない。
# crio_package_version (正確な deb revision) が指定されたときは kubernetes.yml と同じ baseline 比較を行い、
# 「未導入または指定版未満なら cri-o=<指定版> を導入、指定版より新しければ downgrade せずスキップ」にする。
# 未指定のときは従来どおり cri-o を state=present で導入する (repo 上の任意の版が入る)。
- name: Check CRI-O package version against baseline
  ansible.builtin.shell: |
    set -eu
    desired={{ crio_package_version | quote }}
    installed="$(dpkg-query -W -f='${Version}' cri-o 2>/dev/null || true)"

    if [ -z "$installed" ] || dpkg --compare-versions "$installed" lt "$desired"; then
      printf 'cri-o=%s\n' "$desired"
    elif dpkg --compare-versions "$installed" gt "$desired"; then
      printf 'skip-newer:cri-o=%s\n' "$installed"
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  check_mode: false
  register: crio_package_version_check
  when: (crio_package_version | default('')) | length > 0

- name: Set CRI-O package spec
  ansible.builtin.set_fact:
    crio_package_spec: >-
      {{
        (crio_package_version_check.stdout | default('') | trim
         if (crio_package_version_check.stdout | default('')) is match('^cri-o=') else '')
        if (crio_package_version | default('')) | length > 0
        else 'cri-o'
      }}
    crio_package_newer_than_baseline: >-
      {{
        crio_package_version_check.stdout | default('') | trim
        if (crio_package_version_check.stdout | default('')) is match('^skip-newer:') else ''
      }}

- name: Report CRI-O package newer than baseline
  ansible.builtin.debug:
    msg: "Skipping CRI-O package downgrade during normal apply: {{ crio_package_newer_than_baseline }}"
  when: crio_package_newer_than_baseline | length > 0

- name: Install CRI-O package
  ansible.builtin.apt:
    name: "{{ crio_package_spec }}"
    state: present
    update_cache: true
    allow_change_held_packages: true
    allow_downgrade: false
  become: true
  notify: Restart crio
  when: crio_package_spec | length > 0

- name: Hold CRI-O package to prevent automatic updates
  ansible.builtin.dpkg_selections:
    name: cri-o
    selection: hold
  become: true
  when: (crio_package_version | default('')) | length > 0

- name: Create CRI-O configuration directory
  ansible.builtin.file:
    path: /etc/crio/crio.conf.d
    state: directory
    mode: '0755'
  become: true

- name: Create containers registries configuration directory
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d
    state: directory
    mode: '0755'
  become: true

- name: Configure containers short-name mode
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/99-short-name-mode.conf
    content: |
      short-name-mode = "permissive"
    mode: '0644'
  become: true
  notify: Restart crio

- name: Configure CRI-O for systemd cgroup driver
  ansible.builtin.copy:
    dest: /etc/crio/crio.conf.d/02-cgroup-manager.conf
    content: |
      [crio.runtime]
      conmon_cgroup = "pod"
      cgroup_manager = "systemd"
    mode: '0644'
  become: true
  notify: Restart crio

- name: Assert CRI-O checkpoint/restore level is valid
  ansible.builtin.assert:
    that:
      - crio_checkpoint_restore_level in ['none', 'checkpoint_only']
    fail_msg: >-
      crio_checkpoint_restore_level must be "none" or "checkpoint_only".
      "checkpoint_restore" re-opens the restore path covered by CVE-2026-92574 / CVE-2026-15801 (BOXP-222).

# BOXP-222: [crio.checkpoint_restore] は CRI-O 1.36.6 (CVE-2026-92574 / CVE-2026-15801 修正版) で
# 追加されたテーブル。restore 経路を遮断する値を drop-in で明示し、既定値頼みにしない。
# 1.36.6 未満の CRI-O は未知テーブルを無視する (toml.Decode は undecoded key を許容) ため
# drop-in は無害だが効かない。その版は restore 系 CVE 自体が未修正なので、警告で可視化する。
- name: Warn when CRI-O is older than the checkpoint/restore table (BOXP-222)
  ansible.builtin.debug:
    msg: >-
      WARNING: crio_version {{ crio_version }} is older than 1.36.6.
      05-checkpoint-restore.conf will be written but ignored by this CRI-O, and the restore-path
      fixes for CVE-2026-92574 / CVE-2026-15801 are not present. Upgrade CRI-O to 1.36.6 or newer.
  when: crio_version is version('1.36.6', '<')

- name: Configure CRI-O checkpoint/restore level
  ansible.builtin.copy:
    dest: /etc/crio/crio.conf.d/05-checkpoint-restore.conf
    content: |
      [crio.checkpoint_restore]
      container_level_enabled = "{{ crio_checkpoint_restore_level }}"
    mode: '0644'
  become: true
  notify: Restart crio

- name: Configure CRI-O container log size limit
  ansible.builtin.copy:
    dest: /etc/crio/crio.conf.d/99-log-rotation.conf
    content: |
      [crio.runtime]
      log_size_max = {{ crio_log_size_max }}
    mode: '0644'
  become: true
  notify: Restart crio

- name: Create systemd multi-user.target.wants directory
  ansible.builtin.file:
    path: /etc/systemd/system/multi-user.target.wants
    state: directory
    mode: '0755'
  become: true

- name: Enable CRI-O service via symlink
  ansible.builtin.file:
    src: /usr/lib/systemd/system/crio.service
    dest: /etc/systemd/system/multi-user.target.wants/crio.service
    state: link
  become: true
  when: not ansible_virtualization_type == "docker"
