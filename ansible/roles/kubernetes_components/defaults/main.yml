---
# defaults file for kubernetes_components

# Kubernetes version to install (major.minor or major.minor.patch, e.g. "1.35" or "1.35.1")
kubernetes_version: "1.32"
kubernetes_package_version: "1.32.0-1.1"

# CRI-O version to install (using stable available version)
crio_version: "1.32"
crio_package_version: ""

# Network configuration for kubelet
kubelet_node_ip: ""  # Will be auto-detected if empty
kubelet_cluster_dns: "10.96.0.10"
kubelet_cluster_domain: "cluster.local"

# Container runtime configuration
container_runtime: "cri-o"
container_log_max_size: "1Mi"
container_log_max_files: 2
crio_log_size_max: 1048576

# System configuration
kubernetes_disable_swap: true
kubernetes_enable_modules: true

# Repository configuration
# Kubernetes apt repos only support major.minor format (e.g. v1.35, not v1.35.1)
kubernetes_repo_version: "{{ (kubernetes_version | string).split('.')[:2] | join('.') }}"
kubernetes_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_repo_version }}/deb/Release.key"
kubernetes_apt_repository: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_repo_version }}/deb/"
# CRI-O OBS repos only support major.minor format (e.g. v1.35, not v1.35.0)
crio_repo_version: "{{ (crio_version | string).split('.')[:2] | join('.') }}"
crio_apt_key_url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_repo_version }}/deb/Release.key"
crio_apt_repository: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_repo_version }}/deb/"
crio_version_apt_key_url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_repo_version }}/deb/Release.key"
crio_version_apt_repository: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_repo_version }}/deb/"

# Packages to install
kubernetes_package_names:
  - kubelet
  - kubeadm
  - kubectl

kubernetes_packages:
  - "kubelet={{ kubernetes_package_version }}"
  - "kubeadm={{ kubernetes_package_version }}"
  - "kubectl={{ kubernetes_package_version }}"

# Services to enable
kubernetes_services:
  - kubelet
  - crio

# Kernel modules for container runtime
kernel_modules:
  - overlay
  - br_netfilter

# Sysctl parameters for Kubernetes
sysctl_config:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 512

# etcd resource configuration for ARM boards
# Increased from default 100m CPU / 100Mi memory to accommodate ARM processor characteristics
etcd_resource_requests_cpu: "200m"
etcd_resource_requests_memory: "200Mi"
# Metrics listener for the monitoring/etcd ServiceMonitor (boxp/lolice).
# Single source of truth: templates/kubeadm-config.yaml.j2 (新規クラスタ) と
# tasks/kubeadm.yml (稼働中マニフェストへの追加・追従・待機ポート) の両方がこの値を使う。
# ポート変更時は lolice 側の ServiceMonitor も合わせること。
etcd_listen_metrics_urls: "http://0.0.0.0:2381"

# journald persistent storage configuration
# Disabled by default; enable explicitly for control-plane nodes where persistent logs are needed.
# See playbooks/control-plane.yml for the enabling override.
journald_persistent_storage: false
# Set to true only when removing existing persistent journal history is intended.
journald_purge_persistent_logs: false
# SystemMaxUse=512M / RuntimeMaxUse=256M: BOXP-168 incident post-mortem —
# unbound syslog filled the 29 GB eMMC in 40 days and triggered the sunxi-wdt hardware reset.
journald_system_max_use: "512M"
journald_runtime_max_use: "256M"
journald_max_retention_sec: "1month"
# rsyslog logrotate maxsize cap (logrotate `maxsize` directive, NOT `size`) —
# `maxsize` fires in addition to the time-based trigger; `size` would override it.
# This prevents disk exhaustion between scheduled weekly rotations.
rsyslog_logrotate_maxsize: "200M"

# Node resilience configuration (see tasks/node_resilience.yml)
# Disabled by default; enable explicitly for control-plane nodes.
# See playbooks/control-plane.yml for the enabling override.
#
# Hardware watchdog: recovers a node whose PID1 itself is stuck.
# 🔥 Orange Pi Zero 3 (H618) の sunxi-wdt は max_timeout=16 秒。
#    実機確認: /sys/class/watchdog/watchdog0/timeout = 16、
#    dmesg "sunxi-wdt 30090a0.watchdog: Watchdog enabled (timeout=16 sec, nowayout=0)"。
#    これを超える値を指定すると WDIOC_SETTIMEOUT が EINVAL を返し、
#    systemd は watchdog を諦めてデバイスを閉じる = 設定ファイルはできるのに無効になる。
#    両方の値をハードウェア上限以下に保つこと。
node_resilience_watchdog: false
node_resilience_runtime_watchdog_sec: "15"
node_resilience_reboot_watchdog_sec: "15"
# hung_task_panic: recovers a node where userspace is wedged on I/O but PID1 still runs.
# 300s is deliberately conservative — a task blocked that long on these boards is already dead.
node_resilience_hung_task_panic: false
node_resilience_hung_task_timeout_secs: 300
node_resilience_panic_sec: 10
# armbian-ramlog keeps /var/log on zram (RAM), which discards the logs that explain a hard hang.
node_resilience_disable_armbian_ramlog: false

# kube-scheduler / kube-controller-manager のメトリクス公開
# kubeadm 既定は --bind-address=127.0.0.1 で、Prometheus から scrape できず
# KubeSchedulerDown / KubeControllerManagerDown が恒常的に firing になる
# (実機では 2026-07-04 から1ヶ月鳴りっぱなしだった)。
# ポートは RBAC 認証付き (10259/10257) なので、LAN へ bind しても未認証アクセスはできない。
# 対になる Service 定義: boxp/lolice の argoproj/prometheus-operator/control-plane-metrics-services.yaml
control_plane_metrics_bind_address: false
control_plane_metrics_bind_value: "0.0.0.0"

# kubeadm ClusterConfiguration のネットワーク設定。
# 🔥 稼働中クラスタ (kube-system/kubeadm-config) と一致させること。
#    ずれたまま kubeadm upgrade --config などで流用するとクラスタを壊す。
kubeadm_service_subnet: "10.96.0.0/12"
kubeadm_pod_subnet: "192.178.0.0/16"

# kube-apiserver の HTTP/2 接続再分散 (--goaway-chance)。BOXP-225。
# 3 台の apiserver が同時に再起動すると、in-cluster の watch クライアント (HTTP/2 で 1 本の接続に
# 数百 watch を多重化) が「最初に戻った apiserver」へ集中し、以後は再起動まで動かない。
# 実機 (2026-10-08) では long-running request が CP1 1,054 / CP2 81 / CP3 518 と偏り、
# apiserver RSS が watch 1 本あたり約 0.7MiB 増え、偏った 1 台だけが慢性的なメモリ逼迫
# (ページキャッシュ圧縮 → etcd bbolt の major fault → eMMC 読み込み) に陥っていた。
# goaway-chance は要求のうち指定割合に GOAWAY を返し、クライアントを LB (kubernetes Service /
# kube-proxy) 経由で再接続させて偏りを時間とともにならす、apiserver 組み込みの仕組み。
# 上流推奨の開始値は 0.001 (1/1000 要求)、上限は 0.02。単一 apiserver や LB なし構成では有効にしない。
# 🔥 既定は無効。有効化は Decision Packet (Obsidian: Projects/lolice-k8s-1.36-upgrade/research/
#    boxp-225-cp-memory-watch-skew-20261008) で owner が判断し、playbooks/control-plane.yml 側で
#    1 行だけ切り替える。本番 main への merge は apply-ansible.yml を起動するため、
#    有効化 PR の merge = 本番適用 (serial: 1 で 1 台ずつ apiserver が再起動する) になる。
apiserver_goaway_chance_enabled: false
apiserver_goaway_chance: "0.001"

# kube-apiserver の Go ランタイム soft memory limit (環境変数 GOMEMLIMIT)。BOXP-225 M1。
# W1 (--goaway-chance) で watch の偏りは均されたが、2026-10-09 の実測では 3 台とも apiserver の
# Go heap goal が最大 1.8GiB (runtime sys 2.07〜2.38GiB) まで伸び、MemAvailable 10 分最小が
# 324〜356MiB まで落ちた。既定 GOGC=100 では heap が live heap (7 日最大 977〜1,030MiB) の 2 倍まで
# 伸びてから GC が走り、そのピークがページキャッシュを押し出して etcd bbolt の major fault を起こす。
# GOMEMLIMIT は Go ランタイムの soft limit で、limit に近づくと GC を前倒しし、使っていないヒープを OS へ
# 返す。cgroup memory limit (OOM-kill 経路) ではなく、limit を超えても kill されない (GC CPU は 50% で頭打ち)。
# 値は live heap 最大 + 非 heap ランタイム (約 1.25GiB) に対して余裕を持たせた 1536MiB。
# 形式は Go が受け付ける整数 + 単位 (B / KiB / MiB / GiB) か、無効化の "off" (rollback 用)。
# 🔥 既定は無効。有効化は playbooks/control-plane.yml 側で切り替える。本番 main への merge は
#    apply-ansible.yml を起動し、serial: 1 で apiserver が 1 台ずつ再起動する。
apiserver_gomemlimit_enabled: false
apiserver_gomemlimit: "1536MiB"
