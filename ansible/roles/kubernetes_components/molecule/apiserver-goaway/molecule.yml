---
# kube-apiserver --goaway-chance の反映 (tasks/apiserver_goaway.yml) を検証するシナリオ。
# 実クラスタは使えないので、prepare.yml で kubeadm 形式の静的 Pod マニフェストを模擬し、
# control_plane グループに所属させて control-plane 限定のタスクを通す。
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    platform: "${MOLECULE_DOCKER_PLATFORM:-linux/amd64}"
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd
    env:
      DEBIAN_FRONTEND: noninteractive
    groups:
      - orange_pi_zero3
      - control_plane
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: /usr/bin/python3
        hardware_type: orange_pi_zero3
        architecture: arm64
verifier:
  name: ansible
