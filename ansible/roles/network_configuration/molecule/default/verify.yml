---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check if netplan configuration file exists
      ansible.builtin.stat:
        path: /etc/netplan/01-static-end0.yaml
      register: netplan_config

    - name: Assert netplan configuration exists
      ansible.builtin.assert:
        that:
          - netplan_config.stat.exists
        fail_msg: "Netplan configuration file does not exist"

    - name: Read netplan configuration
      ansible.builtin.slurp:
        src: /etc/netplan/01-static-end0.yaml
      register: netplan_content

    - name: Decode netplan configuration
      ansible.builtin.set_fact:
        netplan_config_content: "{{ netplan_content.content | b64decode }}"

    - name: Assert static IP configuration
      ansible.builtin.assert:
        that:
          - "'dhcp4: false' in netplan_config_content"
          - "'192.168.10.' in netplan_config_content"
          - "'renderer: networkd' in netplan_config_content"
        fail_msg: "Static IP configuration not found"

    - name: Check disable-wireless service
      ansible.builtin.slurp:
        src: /etc/systemd/system/disable-wireless.service
      register: disable_wireless_service

    - name: Check disable-wireless service symlink
      ansible.builtin.stat:
        path: /etc/systemd/system/multi-user.target.wants/disable-wireless.service
      register: disable_wireless_symlink

    - name: Assert WiFi and Bluetooth are disabled on boot
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/sbin/rfkill block wifi' in (disable_wireless_service.content | b64decode)"
          - "'ExecStart=/usr/sbin/rfkill block bluetooth' in (disable_wireless_service.content | b64decode)"
          - disable_wireless_symlink.stat.islnk
          - disable_wireless_symlink.stat.lnk_source == '/etc/systemd/system/disable-wireless.service'
        fail_msg: "WiFi and Bluetooth disable service is not configured"

    - name: Check if RA DNS drop-in directory exists
      ansible.builtin.stat:
        path: /etc/systemd/network/10-netplan-end0.network.d
      register: ra_dns_dropin_dir

    - name: Check if RA DNS drop-in file exists
      ansible.builtin.stat:
        path: /etc/systemd/network/10-netplan-end0.network.d/no-ra-dns.conf
      register: ra_dns_dropin

    - name: Assert RA DNS drop-in is deployed
      ansible.builtin.assert:
        that:
          - ra_dns_dropin_dir.stat.exists
          - ra_dns_dropin.stat.exists
        fail_msg: >-
          RA DNS drop-in /etc/systemd/network/10-netplan-end0.network.d/no-ra-dns.conf is missing —
          IPv6 RA may add excess DNS servers past kubelet's 3-nameserver limit

    - name: Read RA DNS drop-in content
      ansible.builtin.slurp:
        path: /etc/systemd/network/10-netplan-end0.network.d/no-ra-dns.conf
      register: ra_dns_dropin_content

    - name: Assert RA DNS drop-in disables UseDNS
      ansible.builtin.assert:
        that:
          - "'[IPv6AcceptRA]' in (ra_dns_dropin_content.content | b64decode)"
          - "'UseDNS=no' in (ra_dns_dropin_content.content | b64decode)"
        fail_msg: "RA DNS drop-in exists but is missing [IPv6AcceptRA] / UseDNS=no"
