---
- name: Verify exact target packages for standalone APT-source runs
  ansible.builtin.include_tasks: apt_preflight.yml
  when: not (kubernetes_upgrade_apt_preflight_completed | default(false) | bool)
  tags: [upgrade]

- name: Configure Kubernetes apt repository for target version
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_upgrade_version.split('.')[:2] | join('.') }}/deb/ /\n"
    mode: '0644'
  become: true
  tags: [upgrade]

- name: Configure CRI-O apt repository for target version
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/crio.list
    content: "deb https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_upgrade_version.split('.')[:2] | join('.') }}/deb/ /\n"
    mode: '0644'
  become: true
  when: crio_upgrade_version is defined and crio_upgrade_version != ""
  tags: [upgrade]

- name: Remove duplicate CRI-O version-specific apt repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/crio-version.list
    state: absent
  become: true
  when: crio_upgrade_version is defined and crio_upgrade_version != ""
  tags: [upgrade]

- name: Import Kubernetes apt repository GPG key for target version
  ansible.builtin.apt_key:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_upgrade_version.split('.')[:2] | join('.') }}/deb/Release.key"
    state: present
  become: true
  tags: [upgrade]

- name: Import CRI-O apt repository GPG key for target version
  ansible.builtin.apt_key:
    url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_upgrade_version.split('.')[:2] | join('.') }}/deb/Release.key"
    state: present
  become: true
  when: crio_upgrade_version is defined and crio_upgrade_version != ""
  tags: [upgrade]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
  tags: [upgrade]

# BOXP-672: kubernetes_components holds cri-o, and apt refuses to change a held
# package ("Held packages were changed and -y was used without
# --allow-change-held-packages"). Release only the cri-o hold, only when the
# installed revision differs from the target, and put it back even if the
# install fails. Other held packages (kubeadm/kubelet/kubectl) stay protected.
- name: Read CRI-O package selection and installed revision
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${db:Status-Want} ${Version}"
      - cri-o
  register: crio_upgrade_package_state
  become: true
  check_mode: false
  changed_when: false
  failed_when: false
  when: crio_upgrade_version is defined and crio_upgrade_version != ""
  tags: [upgrade]

- name: Upgrade CRI-O with its package hold released only for this install
  when:
    - crio_upgrade_version is defined and crio_upgrade_version != ""
    - not ansible_check_mode
  tags: [upgrade]
  vars:
    crio_upgrade_release_hold: >-
      {{ crio_upgrade_package_state.rc == 0
         and (crio_upgrade_package_state.stdout.split() | first | default("")) == "hold"
         and (crio_upgrade_package_state.stdout.split() | last | default("")) != crio_upgrade_package }}
  block:
    - name: Release CRI-O package hold for the upgrade
      ansible.builtin.dpkg_selections:
        name: cri-o
        selection: install
      become: true
      when: crio_upgrade_release_hold | bool

    - name: Upgrade CRI-O
      ansible.builtin.apt:
        name: "cri-o={{ crio_upgrade_package }}"
        state: present
        update_cache: false
      become: true
      notify: Restart crio
  always:
    - name: Restore CRI-O package hold
      ansible.builtin.dpkg_selections:
        name: cri-o
        selection: hold
      become: true
      when: crio_upgrade_release_hold | bool
