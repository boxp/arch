---
# Target versions
kubernetes_upgrade_version: ""       # e.g., "1.35.1"
kubernetes_upgrade_package: ""       # e.g., "1.35.1-1.1"
crio_upgrade_version: ""             # e.g., "1.35.1"
crio_upgrade_package: ""             # exact apt revision, e.g., "1.35.1-1.1"
kubernetes_upgrade_apt_preflight_temp_root: /var/tmp
kubernetes_upgrade_apt_preflight_kubernetes_key_url: >-
  https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_upgrade_version.split('.')[:2] | join('.') }}/deb/Release.key
kubernetes_upgrade_apt_preflight_crio_key_url: >-
  https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_upgrade_version.split('.')[:2] | join('.') }}/deb/Release.key
kubernetes_upgrade_apt_preflight_kubernetes_repository: >-
  https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_upgrade_version.split('.')[:2] | join('.') }}/deb/
kubernetes_upgrade_apt_preflight_crio_repository: >-
  https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_upgrade_version.split('.')[:2] | join('.') }}/deb/

# Previous versions (for rollback reference — actual rollback uses etcd snapshot)
kubernetes_previous_version: ""      # e.g., "1.34"
kubernetes_previous_package: ""      # e.g., "1.34.0-1.1"
crio_previous_version: ""

# Upgrade behavior
upgrade_drain_timeout: 300           # seconds
kubernetes_worker_drain_timeout: 1800
upgrade_health_check_retries: 30
upgrade_health_check_delay: 10       # seconds
upgrade_uncordon_retries: 18
upgrade_uncordon_delay: 10           # seconds
kubeadm_upgrade_etcd: false          # skip kubeadm's etcd static pod phase unless explicitly enabled
kubernetes_worker_drain_delegate: "{{ groups['control_plane'][1] | default(groups['control_plane'][0]) }}"
# kube-controller-manager feature gates injected only through `kubeadm upgrade
# apply/node --patches`, i.e. only at the moment this control plane's static pod
# manifests are regenerated for the target version. Empty (default) = no-op and
# the kubeadm commands run exactly as before.
# BOXP-618: Kubernetes 1.37.0-1.37.2 need NodeControllerLeaseCircuitBreaker=false
# to avoid kubernetes#141572, but KCM 1.36 rejects that unknown gate and exits,
# so the flag must never be written into a 1.36 manifest or kubeadm-config.
# Example: {NodeControllerLeaseCircuitBreaker: false}
kubernetes_upgrade_controller_manager_feature_gates: {}
# Target minors the gates above are known to be accepted by. Upgrading to any
# other minor with gates set fails in pre_checks so they are re-evaluated
# (a gate that becomes GA/locked or removed would stop KCM on the new minor).
kubernetes_upgrade_controller_manager_feature_gates_minors: ["1.37"]
kubernetes_upgrade_kubeadm_patches_dir: /etc/kubernetes/kubeadm-upgrade-patches
kubernetes_upgrade_kubeadm_patches_arg: >-
  {{ ("--patches=" ~ kubernetes_upgrade_kubeadm_patches_dir)
     if (kubernetes_upgrade_controller_manager_feature_gates | length > 0) else "" }}

# Pre-check readiness retry: first attempt plus this many retries, with the
# delay between them (12 x 15s = at least 3 minutes of waiting). Bounded so one
# apiserver liveness restart is tolerated but a persistently NotReady node or
# an unreachable API still fails.
kubernetes_upgrade_pre_check_ready_retries: 12
kubernetes_upgrade_pre_check_ready_delay: 15   # seconds
# Worker pre-checks run kubectl on kubernetes_worker_drain_delegate but target
# the cluster VIP so one control plane's apiserver restart does not fail them
kubernetes_upgrade_worker_pre_check_api_server: "https://{{ cluster_vip }}:6443"

# etcd snapshot
etcd_snapshot_dir: /var/lib/etcd-snapshots
etcd_snapshot_pod_dir: /var/lib/etcd
etcd_snapshot_cleanup_pod_file: true
etcd_snapshot_cleanup_host_file: false
etcd_snapshot_force: false
etcd_snapshot_store_namespace: etcd-snapshots
etcd_snapshot_store_pod_selector: app.kubernetes.io/name=etcd-snapshot-store
etcd_snapshot_store_mount_path: /snapshots
etcd_snapshot_store_retention_count: 3
etcd_snapshot_store_min_free_bytes: 1073741824
etcd_cacert: /etc/kubernetes/pki/etcd/ca.crt
etcd_cert: /etc/kubernetes/pki/etcd/healthcheck-client.crt
etcd_key: /etc/kubernetes/pki/etcd/healthcheck-client.key

# etcd initial cluster (for rollback restore)
etcd_initial_cluster: ""

# Rollback snapshot timestamp (for rollback tasks)
snapshot_timestamp: ""

# kubectl configuration
kubeconfig_path: /etc/kubernetes/admin.conf
kubectl_api_server: "https://{{ node_ip | default(cluster_vip) }}:6443"
kubectl_api_server_arg: "{{ '--server=' ~ kubectl_api_server if (kubectl_api_server | length) > 0 else '' }}"

# Role detection
node_role: "control_plane"           # "control_plane" or "worker"
is_first_control_plane: false        # true for shanghai-1
