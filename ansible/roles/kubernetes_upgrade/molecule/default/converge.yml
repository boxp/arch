---
- name: Converge
  hosts: all
  become: true
  tasks:
    # fetch writes to the Ansible controller.  Make each Molecule run
    # independent of artifacts left by an earlier run on that controller.
    - name: Remove stale isolated etcd snapshots from the controller
      ansible.builtin.file:
        path: /tmp/isolated-etcd-snapshots
        state: absent
      delegate_to: localhost
      become: false

    # Test pre_checks tasks
    - name: Run pre-upgrade checks
      ansible.builtin.include_role:
        name: kubernetes_upgrade
        tasks_from: pre_checks.yml
      tags: [pre_checks]

    # Test etcd snapshot tasks
    - name: Take etcd snapshot
      ansible.builtin.include_role:
        name: kubernetes_upgrade
        tasks_from: etcd_snapshot.yml
      vars:
        etcd_snapshot_local_dir: /tmp/isolated-etcd-snapshots
      tags: [etcd_snapshot]

    # Test apt source update template generation
    - name: Update apt source
      ansible.builtin.include_role:
        name: kubernetes_upgrade
        tasks_from: upgrade_apt_source.yml
      tags: [upgrade]

    # Test health check tasks
    - name: Run health check
      ansible.builtin.include_role:
        name: kubernetes_upgrade
        tasks_from: health_check.yml
      tags: [health_check]
