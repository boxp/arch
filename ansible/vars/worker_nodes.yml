---
# BOXP-269: per-worker (golyat-*) image facts consumed only by
# playbooks/worker-image.yml, scripts/images/build-gpu-worker-image.sh and the
# image verifier. The common worker baseline lives in the playbook; only what
# differs between machines is recorded here.
#
# This file is deliberately separate from vars/nodes.yml: nodes.yml is loaded
# by the control-plane playbooks too, so editing it makes apply-ansible.yml
# re-apply every node, while a change here is resolved (by
# .github/scripts/ansible-apply-targets.sh) to the workers only.
#
# - ip: the node's cluster address (hostname -> IP for the baked static
#   network, kubelet --node-ip). Must match inventories/production/hosts.yml
#   and, for nodes already under live management, node_ips in vars/nodes.yml
#   (the playbook asserts both).
# - interface: production NIC name used for the baked systemd-networkd static
#   address (worker_configure_static_network=true). Names were read from the
#   running nodes on 2026-10-22; they are predictable-name based and survive a
#   reinstall as long as the hardware does not change.
# - gpu_host_tools: whether the Intel GPU runtime/host tools are baked into the
#   image (gpu_worker_host_tools role). Only golyat-4 runs GPU workloads.
#
# Membership here does NOT add a node to plan-ansible / apply-ansible; those
# workflows keep their own explicit node list (G1 of BOXP-269, separate PR).
worker_nodes:
  golyat-1:
    hardware: "GMKtec NucBox G3 (Intel N100), Intel I225-V onboard NIC"
    ip: "192.168.10.101"
    interface: enp3s0
    gpu_host_tools: false
  golyat-2:
    # Lenovo ThinkPad X1 Yoga. The production link is a USB Ethernet adapter,
    # so the name is derived from the adapter MAC (enx<mac>). Replacing the
    # adapter changes this name and requires a rebuild. The onboard enp0s31f6
    # is unused/DOWN. First boot of the noble image on this hardware (USB NIC
    # on kernel 6.8) is NOT yet verified.
    hardware: "Lenovo ThinkPad X1 Yoga (Intel i5-6200U), USB Ethernet adapter (ax88179_178a)"
    ip: "192.168.10.105"
    interface: enx207bd2213354
    gpu_host_tools: false
  golyat-3:
    hardware: "GMKtec NucBox G3 (Intel N100), Intel I226-V onboard NIC"
    ip: "192.168.10.106"
    interface: enp3s0
    gpu_host_tools: false
  golyat-4:
    hardware: "GMKtec EVO-T1, onboard RTL8125 2.5GbE NIC (r8169)"
    ip: "192.168.10.107"
    interface: enp44s0
    gpu_host_tools: true
