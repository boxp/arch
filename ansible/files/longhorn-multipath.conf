# BOXP-267: Longhorn (v1 data engine) exposes each volume as a single-path iSCSI
# disk served by tgt, which reports SCSI vendor "IET" and product "VIRTUAL-DISK".
# multipathd on golyat-4 claimed such a disk (2026-10-11 and 2026-10-22), held the
# block device and made the CSI ext4 mount fail with "already mounted or mount
# point busy" (exit 32). Exclude only these disks: real disks (nvme, USB sd*) and
# the root /etc/multipath.conf stay untouched. A blacklist match is evaluated before
# the remembered-WWID file, so the stale entry there becomes inert.
blacklist {
    device {
        vendor "^IET$"
        product "^VIRTUAL-DISK$"
    }
}
