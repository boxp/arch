---
all:
  children:
    control_plane:
      hosts:
        shanghai-1:
          ansible_host: 192.168.10.102
          node_ip: 192.168.10.102
        shanghai-2:
          ansible_host: 192.168.10.103
          node_ip: 192.168.10.103
        shanghai-3:
          ansible_host: 192.168.10.104
          node_ip: 192.168.10.104
      vars:
        ansible_user: boxp
        ansible_ssh_common_args: '-o ProxyCommand="cloudflared access ssh --hostname %h"'
        ansible_python_interpreter: /usr/bin/python3

        # Kubernetes configuration
        kubernetes_version: "1.37.2"
        kubernetes_package_version: "1.37.2-1.1"
        crio_version: "1.37.4"
        crio_package_version: "1.37.4-1.1"

        # BOXP-191 / BOXP-618: while the cluster is on Kubernetes 1.37, run
        # kube-controller-manager with NodeControllerLeaseCircuitBreaker=false to
        # avoid kubernetes#141572 (panic when leaving disruption mode for a node
        # with no health entry; 1.37.0-1.37.2 affected, fix #141622 unmerged).
        # The kubernetes_upgrade role adds it with `kubeadm upgrade apply/node
        # --patches` only when that control plane manifests are regenerated.
        # It resolves to {} for every other target (KCM 1.36 exits on the
        # unknown gate), so 1.36 patch upgrades and the normal Apply are unchanged.
        # Removal: return this to {} and re-run kubeadm upgrade when moving to a
        # 1.37.x patch that contains the #141622 fix; a 1.38 target resolves to {}
        # and the gate must be re-evaluated before any reuse.
        kubernetes_upgrade_controller_manager_feature_gates: >-
          {{ {'NodeControllerLeaseCircuitBreaker': false}
             if (kubernetes_upgrade_version | default('') | string).split('.')[:2] | join('.') == '1.37'
             else {} }}

        # Cluster configuration
        cluster_vip: "192.168.10.99"
        cluster_domain: "cluster.local"
        cluster_dns: "10.96.0.10"

        # Hardware configuration
        hardware_type: "orange_pi_zero3"
        architecture: "arm64"
        # Network configuration
        network_gateway: "192.168.10.1"
        network_dns_servers:
          - "8.8.8.8"
          - "8.8.4.4"
    workers:
      hosts:
        golyat-1:
          ansible_host: 192.168.10.101
          node_ip: 192.168.10.101
        golyat-2:
          ansible_host: 192.168.10.105
          node_ip: 192.168.10.105
        golyat-3:
          ansible_host: 192.168.10.106
          node_ip: 192.168.10.106
        golyat-4:
          ansible_host: 192.168.10.107
          node_ip: 192.168.10.107
          hardware_type: "gmktec_evo_t1"
          architecture: "amd64"
          gpu_worker: true
      vars:
        ansible_user: boxp
        ansible_ssh_common_args: '-o ProxyCommand="cloudflared access ssh --hostname %h"'
        ansible_python_interpreter: /usr/bin/python3

        # Kubernetes configuration
        kubernetes_version: "1.37.2"
        kubernetes_package_version: "1.37.2-1.1"
        crio_version: "1.37.4"
        crio_package_version: "1.37.4-1.1"

        # Cluster configuration
        cluster_vip: "192.168.10.99"
        cluster_domain: "cluster.local"
        cluster_dns: "10.96.0.10"

        # Hardware configuration
        hardware_type: "orange_pi_zero3"
        architecture: "arm64"
        # Network configuration
        network_gateway: "192.168.10.1"
        network_dns_servers:
          - "8.8.8.8"
          - "8.8.4.4"
