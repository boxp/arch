---
- name: Configure Orange Pi Zero 3 control plane nodes
  hosts: all
  become: true
  gather_facts: true
  # 3ノード構成の control plane を必ず1台ずつ処理する。
  # 既定の linear strategy ではタスク単位で全ホストを横断するため、task 側の throttle: 1 だけでは
  # 「全ホストのマニフェストを書き換えてから、全ホストの復旧を待つ」順序になり、
  # etcd 静的 Pod が3台ほぼ同時に再起動して quorum を失う。
  # Restart crio / Restart kubelet ハンドラにも同じ危険があるため play 単位で直列化する。
  # serial: 1 は同時に max_fail_percentage 既定 0 と組み合わさり、1台失敗した時点で play が止まる。
  serial: 1
  vars_files:
    - ../vars/nodes.yml
  vars:
    # Node-specific IP (should be set by build process)
    node_ip: "{{ node_ips[node_name] }}"
    cluster_vip: "{{ cluster.vip }}"
    cluster_domain: "{{ cluster.domain }}"
    cluster_dns: "{{ cluster.dns }}"

  tasks:
    - name: Check if running in chroot environment
      ansible.builtin.stat:
        path: /proc/1/root
      register: proc_root_stat
      tags: [ssh, bootstrap]

    - name: Detect chroot environment
      ansible.builtin.set_fact:
        is_chroot: "{{ proc_root_stat.stat.islnk | default(false) }}"
      tags: [ssh, bootstrap]

    - name: Ensure SSH server is installed and configured
      tags: [ssh, bootstrap]
      block:
        - name: Install OpenSSH server
          ansible.builtin.apt:
            name: openssh-server
            state: present
            update_cache: true
          tags: [ssh, bootstrap]

        - name: Create systemd multi-user.target.wants directory
          ansible.builtin.file:
            path: /etc/systemd/system/multi-user.target.wants
            state: directory
            mode: '0755'
          tags: [ssh, bootstrap]

        - name: Enable SSH service via symlink
          ansible.builtin.file:
            src: /lib/systemd/system/ssh.service
            dest: /etc/systemd/system/multi-user.target.wants/ssh.service
            state: link
          tags: [ssh, bootstrap]

        - name: Create SSH privilege separation directory for chroot
          ansible.builtin.file:
            path: /run/sshd
            state: directory
            mode: '0755'
          when: is_chroot | bool
          tags: [ssh, bootstrap]

        - name: Configure SSH server
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            validate: 'sshd -t -f %s'
          loop:
            - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
            - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
            - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
            - { regexp: '^#?ChallengeResponseAuthentication', line: 'ChallengeResponseAuthentication no' }
          notify: Restart SSH service
          tags: [ssh, bootstrap]

  handlers:
    - name: Restart SSH service
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      when: not (is_chroot | default(false) | bool)

  roles:
    - role: user_management
      tags: [users, bootstrap]
      vars:
        user_management_use_github_keys: true
        user_management_github_username: "boxp"
    - role: network_configuration
      tags: [network, bootstrap]
      vars:
        network_ip_address: "{{ node_ip }}"
        network_gateway: "{{ cluster.gateway }}"
        network_dns_servers: "{{ cluster.dns_servers }}"

    - role: kubernetes_components
      tags: [kubernetes, k8s-components]
      vars:
        kubernetes_version: "1.36.3"
        kubernetes_package_version: "1.36.1-1.1"
        crio_version: >-
          {{
            {
              'shanghai-1': '1.36.1',
              'shanghai-2': '1.36.1',
              'shanghai-3': '1.36.1'
            }[node_name]
          }}
        kubelet_cluster_dns: "{{ cluster_dns }}"
        kubelet_cluster_domain: "{{ cluster_domain }}"
        kubelet_node_ip: "{{ node_ip }}"
        journald_persistent_storage: true
        # 2026-08-01 の shanghai-1 ハング (3日間無応答) 対策。docs/project_docs/shanghai-node-resilience/plan.md
        node_resilience_watchdog: true
        node_resilience_hung_task_panic: true
        # armbian-ramlog が /var/log を zram に置くため、journald_persistent_storage が
        # 実際には永続化されていなかった。これを外して初めて上の設定が効く。
        node_resilience_disable_armbian_ramlog: true
        # kubeadm 既定の bind-address=127.0.0.1 では scrape できず
        # KubeSchedulerDown / KubeControllerManagerDown が恒常的に firing になる。
        control_plane_metrics_bind_address: true

  post_tasks:
    # serial: 1 で次のノードへ進む前に、ハンドラ (Restart crio / Restart kubelet) を
    # ここで実行し切る。既定ではハンドラは play の最後、つまり role 内の etcd 健全性確認より
    # 後に走るため、そのままでは「前ノードの etcd が未復帰のまま次のバッチが始まる」ことになり、
    # 2 台目の etcd も再起動して quorum を失う。
    - name: Flush handlers before verifying etcd health
      ansible.builtin.meta: flush_handlers

    # ハンドラによる crio/kubelet 再起動は静的 Pod を巻き込むので、改めて復帰を確認する。
    - name: Verify this node's etcd rejoined before the next serial batch
      ansible.builtin.include_role:
        name: kubernetes_components
        tasks_from: etcd_health_gate
      when:
        - inventory_hostname in groups['control_plane'] | default([])
        - etcd_manifest.stat.exists | default(false)
