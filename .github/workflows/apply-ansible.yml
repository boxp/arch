name: Apply Ansible

on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - '.github/workflows/apply-ansible.yml'

concurrency:
  group: lolice-production-cluster-mutation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        node: [shanghai-1, shanghai-2, shanghai-3, golyat-4]
      max-parallel: 1
      fail-fast: true
    env:
      NODE_IPS: '{"shanghai-1":"192.168.10.102","shanghai-2":"192.168.10.103","shanghai-3":"192.168.10.104","golyat-4":"192.168.10.107"}'
      # BOXP-225 P2b: control plane に Apply を走らせる前に memory の余力を待つ (wait 型、skip/fail はしない)。
      CP_APPLY_MIN_MEMAVAILABLE_MIB: 600
      CP_APPLY_HEADROOM_WAIT_SECONDS: 300
      CP_APPLY_HEADROOM_POLL_SECONDS: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::839695154978:role/GitHubActions_Ansible_Apply
          aws-region: ap-northeast-1

      - name: Setup Cloudflare credentials
        id: cf-credentials
        run: |
          # Get Cloudflare Access credentials with retry logic
          CF_ID=""
          for i in 1 2 3; do
            CF_ID=$(aws ssm get-parameter --name "bastion-cf-access-client-id" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_ID"
            sleep 5
          done
          if [ -z "$CF_ID" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_ID after 3 attempts"
            exit 1
          fi

          CF_SECRET=""
          for i in 1 2 3; do
            CF_SECRET=$(aws ssm get-parameter --name "bastion-cf-access-client-secret" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_SECRET"
            sleep 5
          done
          if [ -z "$CF_SECRET" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_SECRET after 3 attempts"
            exit 1
          fi

          # Mask secrets in logs
          echo "::add-mask::$CF_ID"
          echo "::add-mask::$CF_SECRET"

          echo "CF_ACCESS_CLIENT_ID=$CF_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          working_directory: aqua

      - name: Setup SSH config
        run: |
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."${{ matrix.node }}"')

          # Configure SSH to route through bastion for the target node IP
          cat >> ~/.ssh/config << EOF
          Host bastion
            HostName bastion.b0xp.io
            User ansible
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
            StrictHostKeyChecking accept-new

          # Match by IP address (used by ansible_host)
          Host ${NODE_IP}
            HostName ${NODE_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: |
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."${{ matrix.node }}"')
          echo "Testing SSH connectivity to ${{ matrix.node }} (${NODE_IP}) via bastion..."
          ssh -o ConnectTimeout=60 "${NODE_IP}" "echo 'SSH connection successful to ${{ matrix.node }}'"

      # BOXP-225 P2b: control plane に Ansible を走らせる前に memory の余力を待つ。
      # MemAvailable が閾値未満の CP で Ansible を走らせると etcd の major fault / apiserver stall を誘発し、
      # leader change や liveness kill に至った実績がある (plan 側は PR #13491 で待機 + skip)。
      # Apply は途中で止めると部分適用になるため、ここでは待つだけで skip / fail はせず、
      # 待機上限を超えたら warning を出して従来どおり続行する。
      - name: Wait for control plane memory headroom
        id: cp-headroom
        run: |
          NODE="${{ matrix.node }}"
          if [[ "$NODE" != shanghai-* ]]; then
            echo "waited_seconds=0" >> "$GITHUB_OUTPUT"
            echo "${NODE} is not a control plane; headroom wait skipped."
            exit 0
          fi
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."${{ matrix.node }}"')
          MIN_KIB=$(( CP_APPLY_MIN_MEMAVAILABLE_MIB * 1024 ))
          START=$SECONDS
          DEADLINE=$(( SECONDS + CP_APPLY_HEADROOM_WAIT_SECONDS ))
          LAST_MIB="unknown"
          while :; do
            # 各 probe を timeout で上限付きにし、残り待機時間も超えないようにする
            # (ConnectTimeout は接続までしか効かず、remote 側が hang すると待機上限を超えるため)
            PROBE_TIMEOUT=$(( DEADLINE - SECONDS ))
            if [ "$PROBE_TIMEOUT" -gt 60 ]; then PROBE_TIMEOUT=60; fi
            if [ "$PROBE_TIMEOUT" -lt 1 ]; then PROBE_TIMEOUT=1; fi
            AVAIL_KIB=$(timeout "$PROBE_TIMEOUT" ssh -o ConnectTimeout=30 "${NODE_IP}" "awk '/^MemAvailable:/ {print \$2}' /proc/meminfo" 2>/dev/null || echo "")
            if [[ "$AVAIL_KIB" =~ ^[0-9]+$ ]]; then
              LAST_MIB=$(( AVAIL_KIB / 1024 ))
              if [ "$AVAIL_KIB" -ge "$MIN_KIB" ]; then
                echo "${NODE}: MemAvailable ${LAST_MIB}MiB >= ${CP_APPLY_MIN_MEMAVAILABLE_MIB}MiB; proceeding with apply."
                echo "waited_seconds=$(( SECONDS - START ))" >> "$GITHUB_OUTPUT"
                echo "memavailable_mib=${LAST_MIB}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "${NODE}: MemAvailable ${LAST_MIB}MiB < ${CP_APPLY_MIN_MEMAVAILABLE_MIB}MiB; waiting."
            else
              echo "${NODE}: could not read MemAvailable (ssh/awk failed); waiting."
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              break
            fi
            # sleep も残り待機時間を超えないようにする
            SLEEP_SECONDS=$(( DEADLINE - SECONDS ))
            if [ "$SLEEP_SECONDS" -gt "$CP_APPLY_HEADROOM_POLL_SECONDS" ]; then SLEEP_SECONDS="$CP_APPLY_HEADROOM_POLL_SECONDS"; fi
            if [ "$SLEEP_SECONDS" -lt 1 ]; then SLEEP_SECONDS=1; fi
            sleep "$SLEEP_SECONDS"
          done
          echo "::warning::Proceeding with Ansible apply on ${NODE} although MemAvailable ${LAST_MIB}MiB stayed below ${CP_APPLY_MIN_MEMAVAILABLE_MIB}MiB for ${CP_APPLY_HEADROOM_WAIT_SECONDS}s (wait-only guard; apply is never skipped)."
          echo "waited_seconds=$(( SECONDS - START ))" >> "$GITHUB_OUTPUT"
          echo "memavailable_mib=${LAST_MIB}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: |
          cd ansible
          uv sync

      - name: Run primary node playbook
        run: |
          cd ansible
          source .venv/bin/activate

          NODE="${{ matrix.node }}"
          if [[ "$NODE" == shanghai-* ]]; then
            PLAYBOOK="playbooks/control-plane.yml"
            PLAYBOOK_NAME="control-plane"
            EXTRA_ARGS=()
          elif [[ "$NODE" == golyat-* ]]; then
            PLAYBOOK="playbooks/worker-image.yml"
            PLAYBOOK_NAME="worker-image"
            EXTRA_ARGS=(-e "worker_configure_static_network=true" -e "worker_static_network_interface=enp44s0")
          else
            echo "::error::Unsupported Ansible target node: $NODE"
            exit 1
          fi

          echo "Running ${PLAYBOOK_NAME} playbook on node: ${NODE}"
          ansible-playbook \
            -i inventories/production/hosts.yml \
            "$PLAYBOOK" \
            --limit "$NODE" \
            -e "ansible_ssh_common_args=''" \
            -e "node_name=${NODE}" \
            "${EXTRA_ARGS[@]}" \
            -v

      - name: Run node-specific playbook
        run: |
          cd ansible
          source .venv/bin/activate

          NODE="${{ matrix.node }}"
          PLAYBOOK="playbooks/node-${NODE}.yml"

          if [ -f "$PLAYBOOK" ]; then
            echo "Running node-specific playbook for: $NODE"
            ansible-playbook \
              -i inventories/production/hosts.yml \
              "$PLAYBOOK" \
              --limit "${NODE}" \
              -e "ansible_ssh_common_args=''" \
              -e "node_name=${NODE}" \
              -v
          else
            echo "No node-specific playbook found for: $NODE (skipping)"
          fi
