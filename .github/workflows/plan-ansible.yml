name: Plan Ansible

on:
  pull_request:
    branches: [main]
    paths:
      - 'ansible/**'
      - '.github/workflows/plan-ansible.yml'
      - '.github/workflows/plan-ansible-node.yml'
      - '.github/workflows/apply-ansible.yml'

jobs:
  control-plane:
    name: Plan ${{ matrix.node }}
    strategy:
      matrix:
        node: [shanghai-1, shanghai-2, shanghai-3]
      # BOXP-225 P2: この workflow 内の CP は従来どおり1台ずつ実行する。
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/plan-ansible-node.yml
    permissions:
      id-token: write
      contents: read
    with:
      node: ${{ matrix.node }}
    secrets:
      ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

  worker:
    name: Plan golyat-4
    uses: ./.github/workflows/plan-ansible-node.yml
    permissions:
      id-token: write
      contents: read
    with:
      node: golyat-4
    secrets:
      ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

  comment:
    needs: [control-plane, worker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      # Privileged jobs must not approve registry/policy files supplied by a PR.
      - name: Checkout trusted aqua definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{github.event.pull_request.base.sha || github.sha}}
          path: .trusted-aqua
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aqua/registry.yaml
            aqua/aqua-policy.yaml

      - name: Use trusted aqua definitions
        run: |
          cp .trusted-aqua/aqua/registry.yaml aqua/registry.yaml
          cp .trusted-aqua/aqua/aqua-policy.yaml aqua/aqua-policy.yaml
          rm -rf .trusted-aqua

      - name: Install aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329
        with:
          aqua_version: v2.64.0
          policy_allow: aqua-policy.yaml
          working_directory: aqua

      - name: Download plan outputs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: plan_outputs
          pattern: plan-*
          merge-multiple: true

      - name: Combine plan outputs
        id: combine
        env:
          CONTROL_PLANE_RESULT: ${{ needs.control-plane.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
        run: |
          python3 .github/scripts/aggregate_ansible_plan.py \
            --input-dir plan_outputs \
            --output plan_combined.json \
            --expected-nodes shanghai-1 shanghai-2 shanghai-3 golyat-4 \
            --job-result "control-plane=$CONTROL_PLANE_RESULT" \
            --job-result "worker=$WORKER_RESULT"
          HAS_CHANGES=$(jq -r '.has_changes' plan_combined.json)
          jq '.plans' plan_combined.json > plan_comment_plans.json
          jq '.problems' plan_combined.json > plan_comment_problems.json
          echo "has_changes=${HAS_CHANGES}" >> "$GITHUB_OUTPUT"

      - name: Hide old comments
        run: github-comment hide --config .github-comment-ansible.yaml -k ansible-plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post comment
        run: |
          github-comment post --config .github-comment-ansible.yaml -k ansible-plan \
            -var "has_changes:${{ steps.combine.outputs.has_changes }}" \
            -var-file "plans_json:plan_comment_plans.json" \
            -var-file "problems_json:plan_comment_problems.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_COMMENT_SHA1: ${{ github.event.pull_request.head.sha }}
