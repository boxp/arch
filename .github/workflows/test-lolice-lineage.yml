name: Test lolice-lineage

on:
  push:
    branches: [main]
    paths:
      - 'apps/lolice-lineage/**'
      - '.github/workflows/test-lolice-lineage.yml'
  pull_request:
    paths:
      - 'apps/lolice-lineage/**'
      - '.github/workflows/test-lolice-lineage.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/lolice-lineage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - run: npm ci
      - run: npm test
      - name: Bundle without deploying
        run: scripts/deploy.sh --placeholder --dry-run
