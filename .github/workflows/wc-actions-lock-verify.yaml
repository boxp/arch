---
name: actions-lock-verify
# BOXP-234: GitHub Actions workflow dependency lockfile (public preview) の検証。
# .github/workflows/actions.lock に onboard 済みの workflow について、
# 依存 action が lockfile に揃っているか (lock 不足・ref 移動) を読み取り専用で確認する。
# --no-onboard により未 onboard の workflow は info 扱いで失敗にしない (限定導入の境界)。
# lockfile が古い場合の追従コマンド (手編集禁止):
#   gh actions-lock --no-interactive --no-onboard --no-narrow --no-migrate-local-actions --no-migrate-local-actions
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
jobs:
  actions-lock-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.ref}}
          persist-credentials: false

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          # Renovate (github-actions manager) が pin する版と揃える。更新時は docs/project_docs/BOXP-234/plan.md の再検証手順に従う。
          GH_ACTIONS_LOCK_VERSION: v0.2.0
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION" --force

      - name: Verify actions.lock (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --no-onboard --no-interactive
