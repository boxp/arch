name: Promote accepted portfolio to production

on:
  workflow_dispatch:
    inputs:
      rollback_deployment_id:
        description: Current shanghai production deployment UUID, recorded before promotion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'boxp/arch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: portfolio-production
    steps:
      - name: Validate rollback ID
        env:
          ROLLBACK_ID: ${{ inputs.rollback_deployment_id }}
        run: |
          [[ "$ROLLBACK_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          echo "Rollback deployment: $ROLLBACK_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 938fea18ace7d80f1ccc5e617ae6fa2fabcfdba0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/portfolio/package-lock.json
      - name: Build accepted source for production
        working-directory: apps/portfolio
        env:
          SITE_ENV: production
          SITE_URL: https://b0xp.io
        run: |
          npm ci
          npm run build
          grep -q 'href="https://lolice-lineage.b0xp.io/"' dist/index.html
          test -s dist/diagrams/lolice-lineage.webp
          test ! -e dist/diagrams/lolice-architecture.webp
          ! grep -rq 'lolice-architecture' dist
          grep -q 'https://b0xp.io' dist/index.html
          ! grep -qi 'noindex' dist/index.html
      - name: Deploy to existing production Pages project
        working-directory: apps/portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name shanghai --branch main --commit-hash 938fea18ace7d80f1ccc5e617ae6fa2fabcfdba0
