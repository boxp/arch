---
name: actions-lock-verify
# BOXP-234: GitHub Actions workflow dependency lockfile (public preview) の検証。
# .github/workflows/actions.lock に onboard 済みの workflow について、依存 action が
# lockfile に揃っているか (lock 不足・ref 移動) を読み取り専用で確認する。
# --no-onboard により未 onboard の workflow は info 扱いで失敗にしない (限定導入の境界)。
# BOXP-207 の制約 (test.yaml / wc-*.yaml の変更は hold の原因になり得る) を避けるため、
# status-check には組み込まず独立した pull_request workflow にしている。
# 週次の "GitHub Actions workflows" PR (手動 merge) でこの check が失敗したら、merge 前に
#   gh actions-lock --no-interactive --no-onboard --no-narrow --no-migrate-local-actions
# を実行して lockfile を追従させる (lockfile は手編集しない)。
on:
  pull_request:
    paths:
      - .github/workflows/**

permissions: {}

jobs:
  actions-lock-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          # 更新時は docs/project_docs/BOXP-234/plan.md の再検証手順に従う。
          GH_ACTIONS_LOCK_VERSION: v0.2.0
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION" --force

      - name: Verify actions.lock (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --no-onboard --no-interactive
