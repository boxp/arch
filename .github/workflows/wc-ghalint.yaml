---
name: ghalint
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
    secrets:
      gh_app_id:
        required: false
      gh_app_private_key:
        required: false
env:
  GH_COMMENT_SHA1: ${{inputs.ref}}
jobs:
  ghalint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.ref}}
          persist-credentials: false

      - id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{secrets.gh_app_id}}
          private_key: ${{secrets.gh_app_private_key}}
          # pull_requests:write - Post comments
          permissions: >-
            {"pull_requests": "write"}
          repositories: >-
            ["${{github.event.repository.name}}"]

      # Privileged jobs must not approve registry/policy files supplied by a PR.
      - name: Checkout trusted aqua definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{github.event.pull_request.base.sha || github.sha}}
          path: .trusted-aqua
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aqua/registry.yaml
            aqua/aqua-policy.yaml

      - name: Use trusted aqua definitions
        run: |
          cp .trusted-aqua/aqua/registry.yaml aqua/registry.yaml
          cp .trusted-aqua/aqua/aqua-policy.yaml aqua/aqua-policy.yaml
          rm -rf .trusted-aqua

      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          policy_allow: aqua/aqua-policy.yaml
        env:
          AQUA_GITHUB_TOKEN: ${{steps.generate_token.outputs.token}}

      - run: github-comment exec -- ghalint run
        env:
          GITHUB_TOKEN: ${{steps.generate_token.outputs.token}}
