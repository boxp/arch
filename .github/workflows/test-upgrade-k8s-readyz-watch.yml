name: Test upgrade-k8s readyz watch

on:
  pull_request:
    paths:
      - scripts/upgrade-k8s/**
      - tests/upgrade-k8s/**
      - .github/workflows/upgrade-k8s.yml
      - .github/workflows/test-upgrade-k8s-readyz-watch.yml
  push:
    branches: [main]
    paths:
      - scripts/upgrade-k8s/**
      - tests/upgrade-k8s/**
      - .github/workflows/upgrade-k8s.yml
      - .github/workflows/test-upgrade-k8s-readyz-watch.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BABASHKA_VERSION: 1.12.218
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Babashka
        run: |
          set -eux
          tmp="$(mktemp -d)"
          curl --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 -fsSL \
            "https://github.com/babashka/babashka/releases/download/v${BABASHKA_VERSION}/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz" \
            -o "${tmp}/bb.tar.gz"
          tar -xzf "${tmp}/bb.tar.gz" -C "${tmp}"
          sudo install -m 0755 "$(find "${tmp}" -type f -name bb | head -n 1)" /usr/local/bin/bb
      - name: Shellcheck
        run: shellcheck -x scripts/upgrade-k8s/readyz-watch.sh tests/upgrade-k8s/readyz-watch-test.sh
      - name: Run readyz-watch fixture tests
        run: tests/upgrade-k8s/readyz-watch-test.sh
