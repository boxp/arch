name: Deploy Hitohako Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/hitohako/**'
      - '.github/workflows/deploy-hitohako.yml'
  pull_request:
    paths:
      - 'apps/hitohako/**'
      - '.github/workflows/deploy-hitohako.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: apps/hitohako
        run: npm ci

      - name: Build
        working-directory: apps/hitohako
        run: npm run build
        env:
          SITE_URL: https://hitohako-stage.b0xp.io
          PUBLIC_SITE_STAGE: 'true'

      # Stage only in this phase. Production (hitohako.b0xp.io) is not deployed from here.
      - name: Deploy to Cloudflare Pages (stage)
        if: github.event_name != 'pull_request'
        working-directory: apps/hitohako
        run: npx wrangler pages deploy dist --project-name boxp-hitohako-stage --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
