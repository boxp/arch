---
name: Path filter
on:
  workflow_call:
    secrets:
      gh_app_id:
        required: false
      gh_app_private_key:
        required: false
    outputs:
      merge_commit_sha:
        value: ${{jobs.path-filter.outputs.merge_commit_sha}}
      update-aqua-checksums:
        value: ${{jobs.path-filter.outputs.update-aqua-checksums}}
      renovate-config-validator:
        value: ${{jobs.path-filter.outputs.renovate-config-validator}}
      conftest-verify:
        value: ${{jobs.path-filter.outputs.conftest-verify}}
      opa-fmt:
        value: ${{jobs.path-filter.outputs.opa-fmt}}
      ghalint:
        value: ${{jobs.path-filter.outputs.ghalint}}
      test-ansible:
        value: ${{jobs.path-filter.outputs.test-ansible}}
      lock-model:
        value: ${{jobs.path-filter.outputs.lock-model}}
      model-replay:
        value: ${{jobs.path-filter.outputs.model-replay}}
      hermes-agent-candidate:
        value: ${{jobs.path-filter.outputs.hermes-agent-candidate}}

jobs:
  path-filter:
    # Get changed files to filter jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      merge_commit_sha: ${{steps.pr.outputs.merge_commit_sha}}
      update-aqua-checksums: ${{steps.changes.outputs.update-aqua-checksums}}
      renovate-config-validator: ${{steps.changes.outputs.renovate-config-validator}}
      conftest-verify: ${{steps.changes.outputs.conftest-verify}}
      opa-fmt: ${{steps.changes.outputs.opa-fmt}}
      ghalint: ${{steps.changes.outputs.ghalint}}
      test-ansible: ${{steps.changes.outputs.test-ansible}}
      lock-model: ${{steps.changes.outputs.lock-model}}
      model-replay: ${{steps.changes.outputs.model-replay}}
      hermes-agent-candidate: ${{steps.changes.outputs.hermes-agent-candidate}}
    steps:
      - name: Generate token
        id: token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{secrets.gh_app_id}}
          private_key: ${{secrets.gh_app_private_key}}
          # pull_requests:read - Get a pull request and list changed files
          permissions: >-
            {
              "pull_requests": "read"
            }
          repositories: >-
            ["${{github.event.repository.name}}"]

      - uses: suzuki-shunsuke/get-pr-action@b002e41164d7a39586b41f17f9caca4e98a1efe4 # v0.1.0
        id: pr
        with:
          github_token: ${{steps.token.outputs.token}}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{steps.token.outputs.token}}
          filters: |
            update-aqua-checksums:
              - aqua/**
              - .github/workflows/test.yaml
              - .github/workflows/wc-update-aqua-checksums.yaml

            renovate-config-validator:
              - renovate.json5
              - .github/workflows/test.yaml
              - .github/workflows/wc-renovate-config-validator.yaml

            conftest-verify:
              - "**.rego"
              - aqua/imports/conftest.yaml
              - .github/workflows/wc-conftest-verify.yaml
              - .github/workflows/test.yaml

            opa-fmt:
              - "**.rego"
              - .github/workflows/wc-opa-fmt.yaml
              - .github/workflows/test.yaml
              - aqua/imports/opa.yaml

            ghalint:
              - .github/workflows/*
              - aqua/imports/ghalint.yaml

            test-ansible:
              - ansible/**
              - .github/workflows/test-ansible.yml
              - .github/workflows/test.yaml

            # Lean models of the Task Board runner: proofs and generated sequences.
            lock-model:
              - tests/codex-workspace/lock-model/**
              - tests/codex-workspace/gate-budget-model/**
              - .github/workflows/test-task-board-lock-model.yml
              - .github/workflows/wc-path-filter.yaml
              - .github/workflows/test.yaml

            # Replay of the generated sequences against the runner: also when the
            # implementation or a replay test changes.
            model-replay:
              - tests/codex-workspace/lock-model/**
              - tests/codex-workspace/gate-budget-model/**
              - tests/codex-workspace/task-board-lock-trace-test.bb
              - tests/codex-workspace/task-board-gate-budget-trace-test.bb
              - docker/codex-workspace/task-board/**
              - .github/workflows/test-task-board-lock-model.yml
              - .github/workflows/wc-path-filter.yaml
              - .github/workflows/test.yaml

            # BOXP-763: build the Hermes Agent candidate image and run the lolice notify
            # lab on it (merge gate of the Renovate updates of the upstream image).
            hermes-agent-candidate:
              - docker/hermes-agent/**
              - .github/workflows/test-hermes-agent-candidate.yml
