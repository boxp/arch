name: Build babashka for armv7 (IS01)

# babashka の公式配布は linux-aarch64 と linux-amd64 のみで 32bit ARM が無い。
# IS01 (ARMv7 / Debian bookworm armhf) 用に GraalVM native-image でクロスビルドする。
#
# アーキテクチャ:
# - boxp/labs-openjdk: ARM32 JVMCI サポートを追加した OpenJDK フォーク (ARM32デバイス上でのGraalVM実行に必要。クロスコンパイルホスト(x86)での本ワークフロー実行時は不要)
# - boxp/graal: ARM32 SubstrateVM サポートを追加した GraalVM フォーク
# - boxp/llvm-project: ARM32 Statepoint サポートを追加した LLVM フォーク
# - LLVM バックエンド経由で ARM32 native-image を生成する計画
#
# 現状 (BOXP-152):
# - ARM32 JVMCI コード: boxp/labs-openjdk master にマージ済み
# - ARM32 SubstrateVM スタブ: boxp/graal master にマージ済み
# - LLVM Statepoints の ARM32 対応: boxp/llvm-project master にマージ済み
# - 完全な ARM32 native-image: 実装中
#
# 参考: GraalVM RISC-V 対応事例 (2023年、約6ヶ月)
# https://medium.com/graalvm/graalvm-native-image-meets-risc-v-899be38eddd9

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-babashka-arm32.yml'
  workflow_dispatch:
    inputs:
      babashka_version:
        description: 'babashka のバージョン (例: 1.12.196)'
        required: false
        type: string
        default: ''
      make_release:
        description: 'GitHub Release を作る'
        required: false
        type: boolean
        default: false
      skip_native_image:
        description: 'native-image ビルドをスキップして babashka uberjar のみを成果物として保存する (make_release=true とは併用不可)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout arch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arch
          persist-credentials: false

      - name: Validate inputs
        if: ${{ inputs.skip_native_image && inputs.make_release }}
        run: |
          echo "Error: skip_native_image=true と make_release=true は同時に使用できません"
          echo "リリースには native-image バイナリが必要です"
          exit 1

      - name: Checkout boxp/llvm-project (ARM32 Statepoints)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boxp/llvm-project
          # ARM32 Statepoints/StackMap/PatchPoint 対応済みコミットを固定（再現可能ビルドのため）
          # NOP opcode fix (t2NOP/NOP → emitInt32) merged in PR#2
          ref: 432549bc1e76f58a65a2e86fd06638c770b78b36
          path: llvm-project
          persist-credentials: false

      - name: Checkout boxp/graal (ARM32 SubstrateVM fork)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boxp/graal
          # ARM32 SubstrateVM + suite.py arm32モジュール登録済みコミットを固定（再現可能ビルドのため）
          ref: c63c416f4de142ad1700f4a3f99924ebe44d6cd1
          path: graal
          persist-credentials: false

      - name: Check ARM32 JDK static libs cache (early, before apt-get)
        id: arm32-static-libs-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: arm32-static-libs
          key: arm32-static-libs-labsjdk-jvmci-25-3-b21-cross-v1
          save-always: true

      - name: Install cross-compilation tools and LLVM 17 (amd64 only)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # ARM32 クロスコンパイル用に armhf マルチアーキテクチャを追加
          sudo dpkg --add-architecture armhf

          # security.ubuntu.com は armhf パッケージを提供していないため、
          # 既存の apt ソースを amd64 専用に制限する。
          # Ubuntu Noble (24.04) は DEB822 形式と legacy 形式の両方が存在する可能性がある。

          # DEB822 形式 (ubuntu.sources) の処理
          for sources_file in /etc/apt/sources.list.d/*.sources; do
            if [ -f "$sources_file" ]; then
              if ! grep -q "^Architectures:" "$sources_file"; then
                sudo sed -i '/^Types: deb/a Architectures: amd64 i386' "$sources_file"
              fi
            fi
          done

          # legacy .list 形式の処理: security.ubuntu.com を amd64 に制限
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb https://security.ubuntu.com|deb [arch=amd64] https://security.ubuntu.com|g' \
              /etc/apt/sources.list
          fi
          for list_file in /etc/apt/sources.list.d/*.list; do
            if [ -f "$list_file" ]; then
              sudo sed -i 's|^deb https\?://[^ ]*ubuntu\.com|deb [arch=amd64] &|g; s|\[arch=amd64\] deb |deb [arch=amd64] |g' \
                "$list_file" 2>/dev/null || true
            fi
          done

          # ports.ubuntu.com から armhf パッケージを取得するソースを追加
          printf '%s\n' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe' \
            | sudo tee /etc/apt/sources.list.d/armhf-ports.list > /dev/null

          # apt-get update をリトライ付きで実行
          for i in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update 失敗 (試行 $i/3)、リトライ中..."
            sleep 10
          done

          # amd64 パッケージをインストール（通常の Ubuntu mirrors から取得、高速）
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            qemu-user \
            qemu-user-static \
            binfmt-support \
            zlib1g-dev \
            curl \
            unzip \
            python3 \
            python3-pip \
            llvm-17 \
            clang-17 \
            lld-17 \
            llvm-17-dev \
            cmake \
            ninja-build

          # llvm-config-17 へのシンボリックリンクを確認
          if ! command -v llvm-config-17 >/dev/null 2>&1; then
            ls /usr/bin/llvm-config*
            sudo ln -sf /usr/bin/llvm-config-17 /usr/local/bin/llvm-config-17
          fi

      - name: Install armhf dev packages for JDK cross-compilation
        # ARM32 JDK static libs のビルドに必要な armhf ライブラリ。
        # キャッシュヒット時はスキップして ports.ubuntu.com の低速ダウンロードを回避。
        if: steps.arm32-static-libs-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          echo "ARM32 JDK static libs cache miss: armhf dev パッケージをインストール"
          for i in 1 2 3; do
            sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
              libasound2-dev:armhf \
              libfontconfig1-dev:armhf \
              libfreetype6-dev:armhf \
              libcups2-dev:armhf \
              libx11-dev:armhf \
              libxext-dev:armhf \
              libxrender-dev:armhf \
              libxrandr-dev:armhf \
              libxtst-dev:armhf \
              libxt-dev:armhf \
              libffi-dev:armhf && break
            echo "armhf パッケージインストール失敗 (試行 $i/3)、リトライ中..."
            sleep 15
          done

      - name: Validate qemu-arm works
        run: |
          set -euo pipefail
          echo "=== qemu-arm 動作確認 ==="
          cat > /tmp/hello-arm.c << 'EOF'
          #include <stdio.h>
          int main() { printf("qemu-arm OK\n"); return 0; }
          EOF
          arm-linux-gnueabihf-gcc /tmp/hello-arm.c -o /tmp/hello-arm
          qemu-arm -L /usr/arm-linux-gnueabihf /tmp/hello-arm
          echo "qemu-arm 動作確認 OK"

      - name: Validate LLVM ARM32 Statepoint support (boxp/llvm-project)
        run: |
          set -euo pipefail
          echo "=== boxp/llvm-project ARM32 Statepoint 変更確認 ==="
          # システムLLVM 17はARM32 Statepointsでクラッシュする（それがboxp/llvm-projectを使う理由）
          # カスタムビルド後にARMAsmPrinter.cppを使った実際のテストを行う
          echo "boxp/llvm-project の ARM32 Statepoint コミットを確認..."
          git -C llvm-project log --oneline -5
          # ARM32 Statepoint実装ファイルの存在確認
          ls llvm-project/llvm/lib/Target/ARM/ARMAsmPrinter.cpp
          grep -c "statepoint\|StackMap\|PatchPoint" llvm-project/llvm/lib/Target/ARM/ARMAsmPrinter.cpp || true
          echo "boxp/llvm-project ARM32変更の確認完了"

      - name: Cache boxp/llvm-project build
        id: llvm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: llvm-project/build
          key: llvm-arm32-statepoints-${{ hashFiles('llvm-project/llvm/lib/Target/ARM/ARMAsmPrinter.cpp', 'llvm-project/llvm/lib/Target/ARM/ARMAsmPrinter.h') }}

      - name: Build boxp/llvm-project (ARM32 Statepoints)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          echo "=== boxp/llvm-project のビルド (ARM32 ターゲット付き) ==="
          if [ "${{ steps.llvm-cache.outputs.cache-hit }}" = "true" ] && [ -f llvm-project/build/bin/llc ]; then
            echo "キャッシュヒット: boxp/llvm-project ビルド済み"
            echo "LLVM_CUSTOM_BUILD_SUCCESS=true" >> "$GITHUB_ENV"
            echo "LLVM_CUSTOM_PREFIX=$PWD/llvm-project/build" >> "$GITHUB_ENV"
          else
            cd llvm-project
            cmake -S llvm -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_TARGETS_TO_BUILD="ARM;X86" \
              -DLLVM_ENABLE_ASSERTIONS=ON \
              -DCMAKE_C_COMPILER=clang-17 \
              -DCMAKE_CXX_COMPILER=clang++-17 \
              -G Ninja
            cmake --build build --target llc llvm-mc llvm-objdump -- "-j$(nproc)"
            echo "LLVM_CUSTOM_BUILD_SUCCESS=true" >> "$GITHUB_ENV"
            echo "LLVM_CUSTOM_PREFIX=$PWD/build" >> "$GITHUB_ENV"
          fi

      - name: Determine babashka version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.babashka_version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            RESPONSE=$(curl --fail -s https://api.github.com/repos/babashka/babashka/releases/latest)
            LATEST=$(echo "$RESPONSE" | jq -re '.tag_name | ltrimstr("v")')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "Error: babashka 最新バージョンの取得に失敗しました"
              exit 1
            fi
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Latest babashka version: $LATEST"
          fi

      - name: Install mx build tool
        run: |
          set -euo pipefail
          # mx のコミット SHA を固定して再現可能ビルドを保証する
          git clone https://github.com/graalvm/mx.git "$HOME/mx"
          git -C "$HOME/mx" checkout 2675b13e58f97d6d37a4090cdcb5a52c280e1d8c
          echo "$HOME/mx" >> "$GITHUB_PATH"

      - name: Install labs-openjdk jvmci-25.3-b21 as boot JDK
        run: |
          set -euo pipefail
          echo "=== labs-openjdk jvmci-25.3-b21 (linux-amd64) をインストール ==="
          LABSJDK_URL="https://github.com/graalvm/labs-openjdk/releases/download/jvmci-25.3-b21/labsjdk-ce-25.0.4.1%2B0-jvmci-25.3-b21-linux-amd64.tar.gz"
          curl --fail -L "$LABSJDK_URL" -o labsjdk.tar.gz
          tar xzf labsjdk.tar.gz
          rm labsjdk.tar.gz
          BOOT_JDK_DIR=$(find . -maxdepth 1 -type d -name "labsjdk-*" | head -1)
          BOOT_JDK="$PWD/$BOOT_JDK_DIR"
          echo "BOOT_JDK=$BOOT_JDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$BOOT_JDK" >> "$GITHUB_ENV"
          echo "$BOOT_JDK/bin" >> "$GITHUB_PATH"
          "$BOOT_JDK/bin/java" -version
          echo "jmods count: $(ls "$BOOT_JDK/jmods" | wc -l)"

      - name: Setup QEMU for ARM32 Docker
        run: |
          set -euo pipefail
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          echo "QEMU ARM32 セットアップ完了"

      - name: Build ARM32 JDK static libs (cross-compile on x86)
        if: steps.arm32-static-libs-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: |
          set -euo pipefail
          echo "=== ARM32 JDK static libs を x86 でクロスコンパイル ==="
          echo "QEMU Docker を使わず x86 ホスト上でクロスコンパイルする方式"
          mkdir -p "$GITHUB_WORKSPACE/arm32-static-libs"

          # labs-openjdk ソースを取得 (ARM32 static libs ビルド用)
          git clone --depth 1 \
            --branch jvmci-25.3-b21 \
            https://github.com/graalvm/labs-openjdk.git labsjdk-src-arm32

          cd labsjdk-src-arm32

          # ARM32 向けクロスコンパイル設定
          # --openjdk-target: ARM32 (armhf) をターゲットに指定
          # --with-boot-jdk: ホスト用 JDK (labs-openjdk jvmci-25.3-b21 / JDK 25)
          # クロスコンパイルのため ARM32 ブート JDK は不要
          # dpkg multiarch で /usr/lib/arm-linux-gnueabihf/ に armhf ライブラリがインストール済み
          #
          # --with-jvm-variants=zero: ARM32 は server JVM をサポートしない場合があるため
          #   zero JVM (interpreter-only) を指定。static-libs-image ビルドには影響しない。
          #
          # PKG_CONFIG: armhf マルチアーキテクチャのライブラリを検出するために必要
          export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig

          bash configure \
            --with-boot-jdk="$BOOT_JDK" \
            --openjdk-target=arm-linux-gnueabihf \
            --with-jvm-variants=zero \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --disable-precompiled-headers \
            --with-extra-cflags="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard" \
            --with-extra-cxxflags="-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard"

          set -o pipefail
          make JOBS="$(nproc)" static-libs-image 2>&1 | tail -50

          # static libs をコピー
          find build -name "*.a" -path "*/static-libs/*" -exec cp {} "$GITHUB_WORKSPACE/arm32-static-libs/" \;
          echo "ARM32 static libs ビルド完了:"
          ls "$GITHUB_WORKSPACE/arm32-static-libs/"

      - name: Build native-image from boxp/graal source
        run: |
          set -euo pipefail
          echo "=== boxp/graal から native-image をビルド ==="
          echo "ARM32 SubstrateVM サポートを含む boxp/graal を使用します"

          # LLVM バックエンドモジュールのビルドに必要。mx はこの環境変数を参照する。
          if [ -z "${LLVM_CUSTOM_PREFIX:-}" ]; then
            echo "Error: LLVM_CUSTOM_PREFIX が設定されていません。boxp/llvm-project ビルドに失敗した可能性があります"
            exit 1
          fi
          export LLVM_TOOLCHAIN_PATH="${LLVM_CUSTOM_PREFIX}"
          echo "LLVM_TOOLCHAIN_PATH=$LLVM_TOOLCHAIN_PATH" >> "$GITHUB_ENV"
          echo "LLVM ツールチェーンを使用: $LLVM_TOOLCHAIN_PATH"

          # カスタム LLVM の共有ライブラリを mx が見つけられるようにする。
          if [ -d "${LLVM_CUSTOM_PREFIX}/lib" ]; then
            export LD_LIBRARY_PATH="${LLVM_CUSTOM_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          fi

          cd graal
          # LLVM バックエンドのビルドに必要なツールチェーンをパスに追加
          if [ -d "${LLVM_CUSTOM_PREFIX}/bin" ]; then
            export PATH="${LLVM_CUSTOM_PREFIX}/bin:${PATH}"
            export LLVM_TOOLCHAIN="${LLVM_CUSTOM_PREFIX}"
            echo "Added custom LLVM to PATH: ${LLVM_CUSTOM_PREFIX}/bin"
          else
            echo "Error: custom LLVM build directory is unavailable: ${LLVM_CUSTOM_PREFIX}"
            exit 1
          fi
          # llvm-config が使えることを確認
          command -v llvm-config >/dev/null 2>&1 || command -v llvm-config-17 >/dev/null 2>&1
          echo "LLVM config found"
          echo "LLVM_TOOLCHAIN_PATH=$LLVM_TOOLCHAIN_PATH"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<unset>}"

          echo "使用 BOOT_JDK: $BOOT_JDK"

          set -o pipefail
          mx --primary-suite-path substratevm --java-home "$BOOT_JDK" build 2>&1 | tail -30
          echo "boxp/graal ビルド成功。native-image バイナリを検索中..."
          GRAALVM_HOME=$(mx --primary-suite-path substratevm graalvm-home)
          BUILT_NI="$GRAALVM_HOME/bin/native-image"
          if [ ! -f "$BUILT_NI" ]; then
            echo "Error: boxp/graal ビルド後に native-image バイナリが見つかりません: $BUILT_NI"
            exit 1
          fi
          BUILT_NI=$(realpath "$BUILT_NI")
          echo "NATIVE_IMAGE_BIN=$BUILT_NI" >> "$GITHUB_ENV"
          dirname "$BUILT_NI" >> "$GITHUB_PATH"
          echo "boxp/graal native-image を設定: $BUILT_NI"
          "$BUILT_NI" --version

      - name: Cross-compile ARM32 clibraries for native-image
        run: |
          set -euo pipefail
          echo "=== ARM32 clibraries クロスコンパイル ==="
          echo "GraalVM native-image が linux-arm32/glibc/ 以下の SVM C ライブラリを必要とするため作成します"

          # NATIVE_IMAGE_BIN から GraalVM ディストリビューションパスを取得
          GRAALVM_HOME_DIR=$(cd "$(dirname "${NATIVE_IMAGE_BIN}")/../../.." && pwd)
          ARM32_CLIB_DIR="${GRAALVM_HOME_DIR}/lib/svm/clibraries/linux-arm32/glibc"
          mkdir -p "${ARM32_CLIB_DIR}"
          echo "ARM32 clibraries dir: ${ARM32_CLIB_DIR}"

          # 参考: linux-amd64 の clibraries 内容を表示
          AMD64_CLIB_DIR="${GRAALVM_HOME_DIR}/lib/svm/clibraries/linux-amd64/glibc"
          if [ -d "${AMD64_CLIB_DIR}" ]; then
            echo "linux-amd64 clibraries (参考):"
            ls "${AMD64_CLIB_DIR}/"
          fi

          ARM32_CC="arm-linux-gnueabihf-gcc"
          ARM32_AR="arm-linux-gnueabihf-ar"
          CFLAGS="-g -gdwarf-5 -fPIC -O2 -D_LITTLE_ENDIAN -ffunction-sections -fdata-sections -fvisibility=hidden -D_FORTIFY_SOURCE=0"

          # --- libchelper.a をクロスコンパイル ---
          LIBCHELPER_SRC="graal/substratevm/src/com.oracle.svm.native.libchelper"
          LIBCHELPER_BUILD="/tmp/arm32-libchelper-obj"
          mkdir -p "${LIBCHELPER_BUILD}"

          echo "libchelper を ARM32 向けにコンパイル中..."
          for c_file in "${LIBCHELPER_SRC}/src/"*.c; do
            basename_c="${c_file##*/}"
            obj_file="${LIBCHELPER_BUILD}/${basename_c%.c}.o"
            echo "  Compiling ${basename_c}..."
            ${ARM32_CC} ${CFLAGS} \
              -I"${LIBCHELPER_SRC}/include" \
              -c "${c_file}" -o "${obj_file}" 2>&1 || {
              echo "  Warning: ${basename_c} のコンパイルをスキップ (ARM32 非対応)"
            }
          done

          OBJ_FILES=($(find "${LIBCHELPER_BUILD}" -name "*.o" 2>/dev/null || true))
          if [ ${#OBJ_FILES[@]} -gt 0 ]; then
            ${ARM32_AR} rcs "${ARM32_CLIB_DIR}/libchelper.a" "${OBJ_FILES[@]}"
            echo "libchelper.a 作成成功: $(ls -la "${ARM32_CLIB_DIR}/libchelper.a")"
          else
            echo "Error: libchelper.a のオブジェクトファイルが生成されませんでした"
            exit 1
          fi

          # --- libjvm.a をクロスコンパイル (JDK headers はアーキテクチャ非依存) ---
          JVM_SRC="graal/substratevm/src/com.oracle.svm.native.jvm.posix"
          JVM_BUILD="/tmp/arm32-libjvm-obj"
          mkdir -p "${JVM_BUILD}"

          JDK_HEADERS="${BOOT_JDK}/include"
          JDK_HEADERS_LINUX="${BOOT_JDK}/include/linux"

          echo "libjvm (JvmFuncs.c) を ARM32 向けにコンパイル中..."
          ${ARM32_CC} ${CFLAGS} -D_GNU_SOURCE \
            -I"${JDK_HEADERS}" \
            -I"${JDK_HEADERS_LINUX}" \
            -c "${JVM_SRC}/src/JvmFuncs.c" \
            -o "${JVM_BUILD}/JvmFuncs.o" 2>&1 && {
            ${ARM32_AR} rcs "${ARM32_CLIB_DIR}/libjvm.a" "${JVM_BUILD}/JvmFuncs.o"
            echo "libjvm.a 作成成功"
          } || echo "Warning: libjvm.a のコンパイルをスキップ"

          echo "=== ARM32 clibraries 完成 ==="
          ls -la "${ARM32_CLIB_DIR}/"

      - name: Download babashka uberjar
        env:
          BB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p babashka-build
          curl --fail -L \
            "https://github.com/babashka/babashka/releases/download/v${BB_VERSION}/babashka-${BB_VERSION}-standalone.jar" \
            -o "babashka-build/babashka-${BB_VERSION}-standalone.jar"

      - name: Build babashka ARM32 native-image
        if: ${{ !inputs.skip_native_image }}
        env:
          BB_VERSION: ${{ steps.version.outputs.version }}
          CC: arm-linux-gnueabihf-gcc
          CXX: arm-linux-gnueabihf-g++
          AR: arm-linux-gnueabihf-ar
          CROSS_COMPILE: arm-linux-gnueabihf-
        run: |
          set -euo pipefail
          echo "=== ARM32 native-image ビルド試行 ==="
          echo "注意: GraalVM の完全な ARM32 LLVM バックエンドサポートは開発中"
          echo "詳細: BOXP-152 (boxp/labs-openjdk + boxp/graal + boxp/llvm-project の ARM32 サポート)"
          echo ""

          # LLVM ツールチェーンパスを確認
          LLVM_TC_PATH="${LLVM_TOOLCHAIN_PATH}"
          echo "使用する LLVM ツールチェーンパス: $LLVM_TC_PATH"
          LLVM_TOOLCHAIN_OPT=()
          NATIVE_IMAGE_EXPERT_OPTIONS=$(native-image --expert-options-all 2>&1)
          if grep -q 'LLVMToolchainPath' <<< "$NATIVE_IMAGE_EXPERT_OPTIONS"; then
            LLVM_TOOLCHAIN_OPT=("-H:LLVMToolchainPath=${LLVM_TC_PATH}")
          else
            echo "LLVMToolchainPath は利用不可。PATH から LLVM を検出します"
            export PATH="${LLVM_TC_PATH}/bin:${PATH}"
          fi

          # LLVM バックエンドツールパスを特定
          LLVM_BACKEND_TOOL_PATH=""
          if [ -n "${NATIVE_IMAGE_BIN}" ]; then
            # native-image は lib/svm/bin/native-image にある
            # GRAALVM_HOME は bin の 3つ上のディレクトリ
            GRAALVM_HOME_DIR=$(cd "$(dirname "${NATIVE_IMAGE_BIN}")/../../.." && pwd)
            CANDIDATE="${GRAALVM_HOME_DIR}/lib/svm/tools/llvm-backend"
            echo "GRAALVM_HOME_DIR: ${GRAALVM_HOME_DIR}"
            echo "LLVM backend candidate: ${CANDIDATE}"
            if [ -d "${CANDIDATE}" ]; then
              echo "LLVM backend exists: YES"
              LLVM_BACKEND_TOOL_PATH="${CANDIDATE}"
              echo "LLVM バックエンドツールパス: ${LLVM_BACKEND_TOOL_PATH}"
            else
              echo "LLVM backend exists: NO"
            fi
          fi
          # LLVM バックエンドオプションを設定
          LLVM_BACKEND_OPT=()
          if [ -n "${LLVM_BACKEND_TOOL_PATH}" ]; then
            LLVM_BACKEND_OPT=("--tool:llvm-backend=${LLVM_BACKEND_TOOL_PATH}")
          fi

          JAR_FILE=$(find babashka-build -name "babashka-*.jar" 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: babashka jar が見つかりません"
            exit 1
          fi

          # babashka JARから -H:+ForeignAPISupport を除去（LLVMバックエンド非対応）
          echo "babashka JAR をパッチ中 (ForeignAPISupport 除去)..."
          mkdir -p /tmp/bb-jar-patched
          unzip -q "$JAR_FILE" -d /tmp/bb-jar-patched/
          PROPS_FILE="/tmp/bb-jar-patched/META-INF/native-image/babashka/babashka/native-image.properties"
          if [ -f "$PROPS_FILE" ]; then
            sed -i 's/-H:+ForeignAPISupport *\\*//g' "$PROPS_FILE"
            echo "ForeignAPISupport を除去しました"
          fi
          cd /tmp/bb-jar-patched && zip -q -r /tmp/bb-arm32-patched.jar . && cd -
          JAR_FILE="/tmp/bb-arm32-patched.jar"
          echo "パッチ済み JAR: $JAR_FILE"

          native-image --version
          native-image --target=linux-arm32 --version
          echo "--target=linux-arm32 is accepted"

          # ARM32 ターゲット指定
          # Platform.ARM32.getArchitecture() が返す arm32 を指定する
          PLATFORM_OPT=("--target=linux-arm32")
          echo "Using platform option: ${PLATFORM_OPT[@]}"

          # ARM32クロスコンパイルではCAnnotationProcessorCache.UseCAPCacheが
          # 自動的にtrueになる（クロスアーキテクチャビルド検出）。
          # ExitAfterQueryCodeGenerationを使って ARM32用のC構造体クエリコードを生成し、
          # arm-linux-gnueabihf-gcc+qemu-armで実行してARM32固有のCAPキャッシュを作成する。
          NATIVE_IMAGE_HOME=$(cd "$(dirname "${NATIVE_IMAGE_BIN}")/../../.." && pwd)
          mkdir -p /tmp/arm32-query /tmp/arm32-capcache

          echo "=== Step 1: ARM32 CAPキャッシュ用クエリコードを生成 ==="
          # ExitAfterQueryCodeGenerationは非ゼロで終了する（正常）
          # QueryIfNotInCAPCache=true: キャッシュミス時にエラーを投げずにクエリコード生成フローに進む
          # LLVMバックエンドオプションを含める必要がある（--target=linux-arm32に必須）
          native-image \
            -H:CompilerBackend=llvm \
            -H:CLibraryPath="$GITHUB_WORKSPACE/arm32-static-libs" \
            "${LLVM_TOOLCHAIN_OPT[@]}" \
            "${LLVM_BACKEND_OPT[@]}" \
            --target=linux-arm32 \
            -H:-CheckToolchain \
            -H:+ExitAfterQueryCodeGeneration \
            -H:+QueryIfNotInCAPCache \
            -H:QueryCodeDir=/tmp/arm32-query \
            -H:CAPCacheDir=/tmp/arm32-capcache \
            -H:+NewCAPCache \
            -H:Name=babashka-arm32 \
            -cp "$JAR_FILE" \
            babashka.main 2>&1 || true

          QUERY_C_COUNT=$(find /tmp/arm32-query -name "*.c" | wc -l)
          echo "生成されたクエリファイル数: ${QUERY_C_COUNT}"
          ls /tmp/arm32-query/*.c 2>/dev/null || true
          # 最初のクエリファイルの内容を表示（デバッグ用）
          head -30 /tmp/arm32-query/*.c 2>/dev/null | head -50 || true

          echo "=== Step 2: クエリコードをARM32でコンパイル・実行してキャッシュ生成 ==="
          # ARM32 GCCの内部インクルードパスを取得（unwind.h等が含まれる）
          ARM_GCC_INCLUDES=$(arm-linux-gnueabihf-gcc --print-file-name=include 2>/dev/null || echo "")
          echo "ARM GCC includes: ${ARM_GCC_INCLUDES}"

          # LLVMDirectives.c が参照する _URC_FATAL_PHASE1_ERROR 等の Itanium C++ ABI enum 値を
          # 明示的に定義する（ARM32 クロスコンパイラの unwind.h に含まれない場合のフォールバック）
          # ARM32 EABI拡張の _URC_FAILURE=9 も追加（GCC ARM unwind.h内部で参照される）
          UNWIND_DEFINES=(
            "-D_URC_NO_REASON=0"
            "-D_URC_FOREIGN_EXCEPTION_CAUGHT=1"
            "-D_URC_FATAL_PHASE2_ERROR=2"
            "-D_URC_FATAL_PHASE1_ERROR=3"
            "-D_URC_NORMAL_STOP=4"
            "-D_URC_END_OF_STACK=5"
            "-D_URC_HANDLER_FOUND=6"
            "-D_URC_INSTALL_CONTEXT=7"
            "-D_URC_CONTINUE_UNWIND=8"
            "-D_URC_FAILURE=9"
          )

          COMPILED=0
          CACHED=0
          FAILED=0
          for qfile in /tmp/arm32-query/*.c; do
            [ -f "$qfile" ] || continue
            base=$(basename "$qfile" .c)

            # ARM32クロスコンパイル
            # - GraalVM include/linux: jni_md.h (JNI platform header)
            # - ARM GCC internal includes: unwind.h, etc.
            # - UNWIND_DEFINES: Itanium C++ ABI enum 値 (unwind.h に含まれない場合のフォールバック)
            echo "  Compiling: $base"
            EXTRA_INCLUDES=()
            [ -n "$ARM_GCC_INCLUDES" ] && EXTRA_INCLUDES+=("-I${ARM_GCC_INCLUDES}")
            if arm-linux-gnueabihf-gcc \
                "$qfile" \
                -I/usr/arm-linux-gnueabihf/include \
                -I"${NATIVE_IMAGE_HOME}/include" \
                -I"${NATIVE_IMAGE_HOME}/include/linux" \
                -I"${NATIVE_IMAGE_HOME}/lib/svm/clibraries/linux-arm32/include" \
                "${EXTRA_INCLUDES[@]}" \
                "${UNWIND_DEFINES[@]}" \
                -lm \
                -o "/tmp/arm32-query/${base}" 2>/tmp/arm32-query/${base}.err; then
              COMPILED=$((COMPILED+1))
              # qemu-armで実行してCAPキャッシュを生成
              if qemu-arm -L /usr/arm-linux-gnueabihf \
                  "/tmp/arm32-query/${base}" \
                  > "/tmp/arm32-capcache/${base}.cap" 2>/dev/null; then
                CACHED=$((CACHED+1))
              else
                FAILED=$((FAILED+1))
                rm -f "/tmp/arm32-capcache/${base}.cap"
              fi
            else
              FAILED=$((FAILED+1))
              echo "  Compile error for $base:"
              cat /tmp/arm32-query/${base}.err 2>/dev/null || true
            fi
          done
          echo "コンパイル成功: ${COMPILED}, キャッシュ生成: ${CACHED}, 失敗: ${FAILED}"
          echo "CAPキャッシュファイル: $(find /tmp/arm32-capcache -name '*.cap' | wc -l) 件"

          echo "=== babashka native-image.properties の内容を確認 ==="
          cat "/tmp/bb-jar-patched/META-INF/native-image/babashka/babashka/native-image.properties" 2>/dev/null || echo "Not found"

          echo "=== Step 3: ARM32 native-imageビルド（CAPキャッシュ使用） ==="
          run_native_image() {
            set -o pipefail
            native-image \
              -H:CompilerBackend=llvm \
              -H:CLibraryPath="$GITHUB_WORKSPACE/arm32-static-libs" \
              -H:CAPCacheDir=/tmp/arm32-capcache \
              -H:+QueryIfNotInCAPCache \
              "${LLVM_TOOLCHAIN_OPT[@]}" \
              "${LLVM_BACKEND_OPT[@]}" \
              --target=linux-arm32 \
              -H:-CheckToolchain \
              --no-fallback \
              -H:-ForeignAPISupport \
              --gc=serial \
              --initialize-at-build-time=com.fasterxml.jackson \
              --features=babashka.impl.CharsetsFeature,clj_easy.graal_build_time.InitClojureClasses \
              -H:Name=babashka-arm32 \
              -cp "$JAR_FILE" \
              babashka.main \
              2>&1 | tee build-output.log
          }

          run_native_image

      - name: Test with qemu-arm
        if: ${{ !inputs.skip_native_image }}
        run: |
          set -euo pipefail
          echo "=== qemu-arm テスト ==="
          if [ ! -f babashka-arm32 ]; then
            echo "Error: babashka-arm32 バイナリが生成されていません"
            exit 1
          fi
          echo "babashka-arm32 バイナリを qemu-arm でテスト中..."
          ls -lh babashka-arm32
          file babashka-arm32
          qemu-arm-static -L /usr/arm-linux-gnueabihf ./babashka-arm32 --version
          qemu-arm-static -L /usr/arm-linux-gnueabihf ./babashka-arm32 \
            -e '(println "Hello from ARM32!")'

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: babashka-arm32-${{ steps.version.outputs.version }}
          path: |
            babashka-arm32
            babashka-build/
            build-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Release を作る
        if: ${{ inputs.make_release && hashFiles('babashka-arm32') != '' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: babashka-arm32-v${{ steps.version.outputs.version }}
          name: babashka ${{ steps.version.outputs.version }} for ARMv7 (IS01)
          body: |
            IS01 (ARMv7 / armhf) 向け babashka ${{ steps.version.outputs.version }} native-image バイナリ。

            ## 使用フォーク
            - [boxp/labs-openjdk](https://github.com/boxp/labs-openjdk): ARM32 JVMCI 対応
            - [boxp/graal](https://github.com/boxp/graal): ARM32 SubstrateVM 対応
            - [boxp/llvm-project](https://github.com/boxp/llvm-project): ARM32 Statepoint 対応

            ## 動作確認
            ```bash
            # qemu-arm でテスト
            qemu-arm-static -L /usr/arm-linux-gnueabihf ./babashka-arm32 --version

            # IS01 実機でテスト
            ./babashka-arm32 --version
            ```
          files: babashka-arm32

