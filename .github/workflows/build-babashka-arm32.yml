name: Build babashka for armv7 (IS01)

# babashka の公式配布に 32bit ARM は無いため、boxp fork の GraalVM (LLVM バックエンド) で
# IS01 (ARMv7 / Debian bookworm armhf) 向け native image をクロスビルドし、qemu-arm で検証する。
# 手順と fork の commit は .github/scripts/build-babashka-arm32.sh を参照 (BOXP-152)。
# qemu-arm の成功は IS01 実機での動作を保証しない。

on:
  workflow_dispatch:
    inputs:
      babashka_version:
        description: 'babashka のバージョン'
        required: false
        type: string
        default: '1.13.225'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    # IS01 と同じ glibc 2.36 / 32bit time_t の userland 向けにビルドする
    container: debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
    env:
      WORK: ${{ github.workspace }}/work
      OUT: ${{ github.workspace }}/out
      SCRIPT: arch/.github/scripts/build-babashka-arm32.sh
    steps:
      - name: Install git for checkout
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - name: Checkout arch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arch
          persist-credentials: false

      - name: Install toolchains
        timeout-minutes: 20
        run: bash "$SCRIPT" deps

      - name: Read cache keys
        id: pins
        run: |
          echo "llvm=$(grep -m1 '^LLVM_SHA=' "$SCRIPT" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "jdk=$(grep -m1 '^LABSJDK_TAG=' "$SCRIPT" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore LLVM toolchain
        id: llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/llvm
          key: arm32-llvm-bookworm-${{ steps.pins.outputs.llvm }}

      - name: Build LLVM toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: bash "$SCRIPT" llvm

      - name: Save LLVM toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/llvm
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Restore JDK static libraries
        id: jdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/jdk-static
          key: arm32-jdk-static-bookworm-${{ steps.pins.outputs.jdk }}

      - name: Build JDK static libraries
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: bash "$SCRIPT" jdk

      - name: Save JDK static libraries
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/jdk-static
          key: ${{ steps.jdk-cache.outputs.cache-primary-key }}

      - name: Build boxp/graal
        timeout-minutes: 40
        run: bash "$SCRIPT" graal

      - name: Generate C annotation cache
        timeout-minutes: 15
        run: bash "$SCRIPT" cap

      - name: Build and verify Hello World
        timeout-minutes: 20
        run: bash "$SCRIPT" hello

      - name: Build and verify babashka
        timeout-minutes: 90
        env:
          BB_VERSION: ${{ inputs.babashka_version }}
        run: bash "$SCRIPT" babashka "$BB_VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: babashka-arm32-${{ inputs.babashka_version }}
          path: |
            out/babashka-arm32
            out/hello-arm32
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
