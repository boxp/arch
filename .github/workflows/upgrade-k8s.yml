name: Kubernetes Upgrade

on:
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: 'Target Kubernetes version (e.g., 1.36.1)'
        required: true
      kubernetes_package:
        description: 'Target package version (e.g., 1.36.1-1.1)'
        required: true
      crio_version:
        description: 'Target CRI-O version (e.g., 1.36.1)'
        required: true
      dry_run:
        description: 'Dry run mode (--check)'
        type: boolean
        default: true
      target_node:
        description: 'Upgrade only the specified node. Run this workflow one node at a time'
        type: choice
        default: shanghai-1
        options:
          - shanghai-1
          - shanghai-2
          - shanghai-3
          - golyat-1
          - golyat-2
          - golyat-3
          - golyat-4
      readyz_watch:
        description: 'BOXP-213: record VIP/CP readyz every 30s during the upgrade and HALT on 3min redundancy loss (opt-in)'
        type: boolean
        default: false
      readyz_observe_minutes:
        description: 'BOXP-213: post-upgrade readyz observation window in minutes, 0-60 (empty = CP/golyat-4 30, worker 15; 0 = skip)'
        type: string
        default: ''

env:
  NODE_IPS: '{"shanghai-1":"192.168.10.102","shanghai-2":"192.168.10.103","shanghai-3":"192.168.10.104","golyat-1":"192.168.10.101","golyat-2":"192.168.10.105","golyat-3":"192.168.10.106","golyat-4":"192.168.10.107"}'
  ALL_NODE_IPS: "192.168.10.102 192.168.10.103 192.168.10.104 192.168.10.101 192.168.10.105 192.168.10.106 192.168.10.107"
  CLUSTER_VIP: "192.168.10.99"
  CONTROL_PLANE_NODES: "shanghai-1 shanghai-2 shanghai-3"
  READYZ_WATCH_DIR: /tmp/readyz-watch

jobs:
  pre-check:
    name: Pre-upgrade Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      K8S_VERSION: ${{ inputs.kubernetes_version }}
      K8S_PACKAGE: ${{ inputs.kubernetes_package }}
      CRIO_VERSION: ${{ inputs.crio_version }}
    steps:
      - name: Validate per-node execution
        run: |
          if [ "${{ inputs.target_node }}" = "all" ]; then
            echo "::error::target_node=all is disabled. Run this workflow once per node and verify cluster health before continuing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::839695154978:role/GitHubActions_Ansible_Apply
          aws-region: ap-northeast-1

      - name: Setup Cloudflare credentials
        id: cf-credentials
        run: |
          CF_ID=""
          for i in 1 2 3; do
            CF_ID=$(aws ssm get-parameter --name "bastion-cf-access-client-id" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_ID"
            sleep 5
          done
          if [ -z "$CF_ID" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_ID after 3 attempts"
            exit 1
          fi

          CF_SECRET=""
          for i in 1 2 3; do
            CF_SECRET=$(aws ssm get-parameter --name "bastion-cf-access-client-secret" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_SECRET"
            sleep 5
          done
          if [ -z "$CF_SECRET" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_SECRET after 3 attempts"
            exit 1
          fi

          echo "::add-mask::$CF_ID"
          echo "::add-mask::$CF_SECRET"
          echo "CF_ACCESS_CLIENT_ID=$CF_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
          working_directory: aqua

      - name: Setup SSH config
        run: |
          cat >> ~/.ssh/config << EOF
          Host bastion
            HostName bastion.b0xp.io
            User ansible
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
            StrictHostKeyChecking accept-new
          EOF

          for NODE_IP in $ALL_NODE_IPS; do
            cat >> ~/.ssh/config << EOF

          Host ${NODE_IP}
            HostName ${NODE_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF
          done

          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: |
          echo "::group::SSH connectivity check"
          FAILED=0
          for NODE_IP in $ALL_NODE_IPS; do
            echo "Testing SSH to ${NODE_IP} via bastion..."
            if ssh -o ConnectTimeout=30 -o BatchMode=yes "${NODE_IP}" "hostname" 2>&1; then
              echo "::notice::SSH OK: ${NODE_IP}"
            else
              echo "::error::SSH FAILED: ${NODE_IP}"
              FAILED=1
            fi
          done
          echo "::endgroup::"
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more nodes are unreachable via SSH. Check bastion/Cloudflare tunnel and SSH keys."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          cd ansible
          uv sync

      - name: Run pre-upgrade checks
        shell: bash
        run: |
          set -eo pipefail
          cd ansible
          source .venv/bin/activate
          echo "Running pre-upgrade checks with K8S_VERSION=${K8S_VERSION}"
          ansible-playbook \
            -i inventories/production/hosts.yml \
            playbooks/upgrade-k8s.yml \
            --tags pre_checks \
            -e "ansible_ssh_common_args=''" \
            -e "kubernetes_upgrade_version=${K8S_VERSION}" \
            -e "kubernetes_upgrade_package=${K8S_PACKAGE}" \
            -e "crio_upgrade_version=${CRIO_VERSION}" \
            -vv 2>&1 | tee /tmp/pre-check-ansible.log

      - name: Take etcd snapshot
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -eo pipefail
          cd ansible
          source .venv/bin/activate
          echo "Taking etcd snapshot before production upgrade and storing it in the Longhorn PVC"
          ansible-playbook \
            -i inventories/production/hosts.yml \
            playbooks/upgrade-k8s.yml \
            --tags etcd_snapshot \
            -e "ansible_ssh_common_args=''" \
            -e "kubernetes_upgrade_version=${K8S_VERSION}" \
            -e "kubernetes_upgrade_package=${K8S_PACKAGE}" \
            -e "crio_upgrade_version=${CRIO_VERSION}" \
            -vv 2>&1 | tee /tmp/etcd-snapshot-ansible.log

      - name: Upload pre-check logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-check-ansible-log
          path: |
            /tmp/pre-check-ansible.log
            /tmp/etcd-snapshot-ansible.log
          retention-days: 14

  upgrade-cp-1:
    name: Upgrade shanghai-1 (first CP)
    needs: [pre-check]
    if: inputs.target_node == 'all' || inputs.target_node == 'shanghai-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      K8S_VERSION: ${{ inputs.kubernetes_version }}
      K8S_PACKAGE: ${{ inputs.kubernetes_package }}
      CRIO_VERSION: ${{ inputs.crio_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::839695154978:role/GitHubActions_Ansible_Apply
          aws-region: ap-northeast-1

      - name: Setup Cloudflare credentials
        id: cf-credentials
        run: |
          CF_ID=""
          for i in 1 2 3; do
            CF_ID=$(aws ssm get-parameter --name "bastion-cf-access-client-id" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_ID"
            sleep 5
          done
          if [ -z "$CF_ID" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_ID after 3 attempts"
            exit 1
          fi

          CF_SECRET=""
          for i in 1 2 3; do
            CF_SECRET=$(aws ssm get-parameter --name "bastion-cf-access-client-secret" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_SECRET"
            sleep 5
          done
          if [ -z "$CF_SECRET" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_SECRET after 3 attempts"
            exit 1
          fi

          echo "::add-mask::$CF_ID"
          echo "::add-mask::$CF_SECRET"
          echo "CF_ACCESS_CLIENT_ID=$CF_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
          working_directory: aqua

      - name: Setup SSH config
        run: |
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."shanghai-1"')

          cat >> ~/.ssh/config << EOF
          Host bastion
            HostName bastion.b0xp.io
            User ansible
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
            StrictHostKeyChecking accept-new

          Host ${NODE_IP}
            HostName ${NODE_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: |
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."shanghai-1"')
          echo "Testing SSH connectivity to shanghai-1 (${NODE_IP}) via bastion..."
          ssh -o ConnectTimeout=60 "${NODE_IP}" "echo 'SSH connection successful to shanghai-1'"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          cd ansible
          uv sync

      - name: Setup SSH config for readyz probe hosts
        if: inputs.readyz_watch
        run: |
          # readyz-<cp> aliases let readyz-watch.sh probe from any non-updating control plane.
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_IP=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')
            cat >> ~/.ssh/config << EOF

          Host readyz-${CP_NAME}
            HostName ${CP_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF
          done
          chmod 600 ~/.ssh/config

      - name: Start readyz watch
        if: inputs.readyz_watch
        run: |
          # BOXP-213 (BOXP-194 A2/H2): background watcher; records VIP + 3 CP readyz every 30s,
          # HALTs when redundancy (VIP, or >=2 non-updating CPs) is lost for 3 minutes.
          mkdir -p "$READYZ_WATCH_DIR"
          CP_ARGS=()
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_ARGS+=(--cp "${CP_NAME}=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')")
          done
          # The subshell records the watcher exit code so the evaluation step can tell
          # "finished without HALT" (0) from "HALT" (2) and "crashed / never ran" (anything else).
          rm -f "$READYZ_WATCH_DIR/rc"
          (
            WATCH_RC=0
            READYZ_SSH_HOST_PREFIX=readyz- nohup scripts/upgrade-k8s/readyz-watch.sh \
              --vip "vip=${CLUSTER_VIP}" \
              "${CP_ARGS[@]}" \
              --updating-node shanghai-1 \
              --interval 30 \
              --halt-after 180 \
              --stop-file "$READYZ_WATCH_DIR/stop" \
              --out-dir "$READYZ_WATCH_DIR" \
              > "$READYZ_WATCH_DIR/watch.log" 2>&1 < /dev/null || WATCH_RC=$?
            echo "$WATCH_RC" > "$READYZ_WATCH_DIR/rc"
          ) &
          echo $! > "$READYZ_WATCH_DIR/pid"
          echo "readyz watch started (pid $(cat "$READYZ_WATCH_DIR/pid"), updating-node shanghai-1)"

      - name: Upgrade shanghai-1
        run: |
          cd ansible
          source .venv/bin/activate
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--check"
          fi
          echo "Upgrading shanghai-1 (first control plane)"
          ansible-playbook \
            -i inventories/production/hosts.yml \
            playbooks/upgrade-k8s.yml \
            --tags upgrade \
            --limit shanghai-1 \
            -e "ansible_ssh_common_args=''" \
            -e "kubernetes_upgrade_version=${K8S_VERSION}" \
            -e "kubernetes_upgrade_package=${K8S_PACKAGE}" \
            -e "crio_upgrade_version=${CRIO_VERSION}" \
            -e "node_role=control_plane" \
            -e "is_first_control_plane=true" \
            ${DRY_RUN_FLAG} \
            -v
      - name: Stop readyz watch and evaluate
        if: always() && inputs.readyz_watch
        run: |
          touch "$READYZ_WATCH_DIR/stop"
          WATCH_PID=$(cat "$READYZ_WATCH_DIR/pid" 2>/dev/null || true)
          if [ -n "$WATCH_PID" ]; then
            for _ in $(seq 1 90); do
              kill -0 "$WATCH_PID" 2>/dev/null || break
              sleep 1
            done
          fi
          WATCH_RC=$(cat "$READYZ_WATCH_DIR/rc" 2>/dev/null || echo missing)
          echo "::group::readyz watch log"
          cat "$READYZ_WATCH_DIR/watch.log" 2>/dev/null || echo "(no watch log)"
          echo "::endgroup::"
          if [ -f "$READYZ_WATCH_DIR/readyz-summary.json" ]; then
            echo "::group::readyz summary"
            cat "$READYZ_WATCH_DIR/readyz-summary.json"
            echo "::endgroup::"
          fi
          if [ -f "$READYZ_WATCH_DIR/HALT" ] || [ "$WATCH_RC" = "2" ]; then
            echo "::error::HALT (BOXP-194 H2): $(cat "$READYZ_WATCH_DIR/HALT" 2>/dev/null). API redundancy was lost for >= 3 minutes while upgrading shanghai-1. Do NOT dispatch the next node and do not re-run this workflow until the cause is understood (decision packet 3.4)."
            exit 2
          fi
          # Safe side: a watcher that crashed, never ran, or is still running did not observe the upgrade.
          if [ "$WATCH_RC" != "0" ]; then
            echo "::error::readyz watch for shanghai-1 did not complete (exit code: ${WATCH_RC}). The upgrade was not observed; treat as HALT and investigate watch.log before dispatching the next node."
            exit 1
          fi
          VERDICT=$(jq -r '.verdict' "$READYZ_WATCH_DIR/readyz-summary.json" 2>/dev/null || echo missing)
          if [ "$VERDICT" != "ok" ]; then
            echo "::error::readyz watch for shanghai-1 ended with verdict '${VERDICT}' (expected ok)."
            exit 1
          fi
          echo "::notice::readyz watch for shanghai-1 finished without HALT"

      - name: Upload readyz watch artifact
        if: always() && inputs.readyz_watch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readyz-watch-shanghai-1
          path: |
            /tmp/readyz-watch/readyz-samples.jsonl
            /tmp/readyz-watch/readyz-events.jsonl
            /tmp/readyz-watch/readyz-summary.json
            /tmp/readyz-watch/HALT
            /tmp/readyz-watch/watch.log
          if-no-files-found: warn
          retention-days: 30


  upgrade-cp-2:
    name: Upgrade shanghai-2
    needs: [pre-check, upgrade-cp-1]
    if: always() && !cancelled() && needs.pre-check.result == 'success' && (needs.upgrade-cp-1.result == 'success' || needs.upgrade-cp-1.result == 'skipped') && (inputs.target_node == 'all' || inputs.target_node == 'shanghai-2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      K8S_VERSION: ${{ inputs.kubernetes_version }}
      K8S_PACKAGE: ${{ inputs.kubernetes_package }}
      CRIO_VERSION: ${{ inputs.crio_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::839695154978:role/GitHubActions_Ansible_Apply
          aws-region: ap-northeast-1

      - name: Setup Cloudflare credentials
        id: cf-credentials
        run: |
          CF_ID=""
          for i in 1 2 3; do
            CF_ID=$(aws ssm get-parameter --name "bastion-cf-access-client-id" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_ID"
            sleep 5
          done
          if [ -z "$CF_ID" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_ID after 3 attempts"
            exit 1
          fi

          CF_SECRET=""
          for i in 1 2 3; do
            CF_SECRET=$(aws ssm get-parameter --name "bastion-cf-access-client-secret" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_SECRET"
            sleep 5
          done
          if [ -z "$CF_SECRET" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_SECRET after 3 attempts"
            exit 1
          fi

          echo "::add-mask::$CF_ID"
          echo "::add-mask::$CF_SECRET"
          echo "CF_ACCESS_CLIENT_ID=$CF_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
          working_directory: aqua

      - name: Setup SSH config
        run: |
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."shanghai-2"')

          cat >> ~/.ssh/config << EOF
          Host bastion
            HostName bastion.b0xp.io
            User ansible
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
            StrictHostKeyChecking accept-new

          Host ${NODE_IP}
            HostName ${NODE_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: |
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."shanghai-2"')
          echo "Testing SSH connectivity to shanghai-2 (${NODE_IP}) via bastion..."
          ssh -o ConnectTimeout=60 "${NODE_IP}" "echo 'SSH connection successful to shanghai-2'"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          cd ansible
          uv sync

      - name: Setup SSH config for readyz probe hosts
        if: inputs.readyz_watch
        run: |
          # readyz-<cp> aliases let readyz-watch.sh probe from any non-updating control plane.
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_IP=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')
            cat >> ~/.ssh/config << EOF

          Host readyz-${CP_NAME}
            HostName ${CP_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF
          done
          chmod 600 ~/.ssh/config

      - name: Start readyz watch
        if: inputs.readyz_watch
        run: |
          # BOXP-213 (BOXP-194 A2/H2): background watcher; records VIP + 3 CP readyz every 30s,
          # HALTs when redundancy (VIP, or >=2 non-updating CPs) is lost for 3 minutes.
          mkdir -p "$READYZ_WATCH_DIR"
          CP_ARGS=()
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_ARGS+=(--cp "${CP_NAME}=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')")
          done
          # The subshell records the watcher exit code so the evaluation step can tell
          # "finished without HALT" (0) from "HALT" (2) and "crashed / never ran" (anything else).
          rm -f "$READYZ_WATCH_DIR/rc"
          (
            WATCH_RC=0
            READYZ_SSH_HOST_PREFIX=readyz- nohup scripts/upgrade-k8s/readyz-watch.sh \
              --vip "vip=${CLUSTER_VIP}" \
              "${CP_ARGS[@]}" \
              --updating-node shanghai-2 \
              --interval 30 \
              --halt-after 180 \
              --stop-file "$READYZ_WATCH_DIR/stop" \
              --out-dir "$READYZ_WATCH_DIR" \
              > "$READYZ_WATCH_DIR/watch.log" 2>&1 < /dev/null || WATCH_RC=$?
            echo "$WATCH_RC" > "$READYZ_WATCH_DIR/rc"
          ) &
          echo $! > "$READYZ_WATCH_DIR/pid"
          echo "readyz watch started (pid $(cat "$READYZ_WATCH_DIR/pid"), updating-node shanghai-2)"

      - name: Upgrade shanghai-2
        run: |
          cd ansible
          source .venv/bin/activate
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
