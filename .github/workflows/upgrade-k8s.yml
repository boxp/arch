            StrictHostKeyChecking accept-new

          Host ${CP_NODE} ${CP_IP}
            HostName ${CP_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: |
          NODE_NAME=golyat-4
          CP_NODE=shanghai-2
          NODE_IP=$(echo '${{ env.NODE_IPS }}' | jq -r '."golyat-4"')
          ssh -o ConnectTimeout=60 "${NODE_IP}" "echo 'SSH connection successful to golyat-4'"
          ssh -o ConnectTimeout=60 "${NODE_NAME}" "echo 'SSH connection successful to golyat-4 inventory name'"
          ssh -o ConnectTimeout=60 "${CP_NODE}" "echo 'SSH connection successful to worker drain delegate shanghai-2'"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          cd ansible
          uv sync

      - name: Setup SSH config for readyz probe hosts
        if: inputs.readyz_watch
        run: |
          # readyz-<cp> aliases let readyz-watch.sh probe from any non-updating control plane.
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_IP=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')
            cat >> ~/.ssh/config << EOF

          Host readyz-${CP_NAME}
            HostName ${CP_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF
          done
          chmod 600 ~/.ssh/config

      - name: Start readyz watch
        if: inputs.readyz_watch
        run: |
          # BOXP-213 (BOXP-194 A2/H2): background watcher; records VIP + 3 CP readyz every 30s,
          # HALTs when redundancy (VIP, or >=2 non-updating CPs) is lost for 3 minutes.
          mkdir -p "$READYZ_WATCH_DIR"
          CP_ARGS=()
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_ARGS+=(--cp "${CP_NAME}=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')")
          done
          # The subshell records the watcher exit code so the evaluation step can tell
          # "finished without HALT" (0) from "HALT" (2) and "crashed / never ran" (anything else).
          rm -f "$READYZ_WATCH_DIR/rc"
          (
            WATCH_RC=0
            READYZ_SSH_HOST_PREFIX=readyz- nohup scripts/upgrade-k8s/readyz-watch.sh \
              --vip "vip=${CLUSTER_VIP}" \
              "${CP_ARGS[@]}" \
              --updating-node golyat-4 \
              --interval 30 \
              --halt-after 180 \
              --stop-file "$READYZ_WATCH_DIR/stop" \
              --out-dir "$READYZ_WATCH_DIR" \
              > "$READYZ_WATCH_DIR/watch.log" 2>&1 < /dev/null || WATCH_RC=$?
            echo "$WATCH_RC" > "$READYZ_WATCH_DIR/rc"
          ) &
          echo $! > "$READYZ_WATCH_DIR/pid"
          echo "readyz watch started (pid $(cat "$READYZ_WATCH_DIR/pid"), updating-node golyat-4)"

      - name: Upgrade golyat-4
        run: |
          cd ansible
          source .venv/bin/activate
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--check"
          fi
          ansible-playbook \
            -i inventories/production/hosts.yml \
            playbooks/upgrade-k8s.yml \
            --tags upgrade \
            --limit golyat-4 \
            -e "ansible_ssh_common_args=''" \
            -e "kubernetes_upgrade_version=${K8S_VERSION}" \
            -e "kubernetes_upgrade_package=${K8S_PACKAGE}" \
            -e "crio_upgrade_version=${CRIO_VERSION}" \
            -e "node_role=worker" \
            ${DRY_RUN_FLAG} \
            -v
      - name: Stop readyz watch and evaluate
        if: always() && inputs.readyz_watch
        run: |
          touch "$READYZ_WATCH_DIR/stop"
          WATCH_PID=$(cat "$READYZ_WATCH_DIR/pid" 2>/dev/null || true)
          if [ -n "$WATCH_PID" ]; then
            for _ in $(seq 1 90); do
              kill -0 "$WATCH_PID" 2>/dev/null || break
              sleep 1
            done
          fi
          WATCH_RC=$(cat "$READYZ_WATCH_DIR/rc" 2>/dev/null || echo missing)
          echo "::group::readyz watch log"
          cat "$READYZ_WATCH_DIR/watch.log" 2>/dev/null || echo "(no watch log)"
          echo "::endgroup::"
          if [ -f "$READYZ_WATCH_DIR/readyz-summary.json" ]; then
            echo "::group::readyz summary"
            cat "$READYZ_WATCH_DIR/readyz-summary.json"
            echo "::endgroup::"
          fi
          if [ -f "$READYZ_WATCH_DIR/HALT" ] || [ "$WATCH_RC" = "2" ]; then
            echo "::error::HALT (BOXP-194 H2): $(cat "$READYZ_WATCH_DIR/HALT" 2>/dev/null). API redundancy was lost for >= 3 minutes while upgrading golyat-4. Do NOT dispatch the next node and do not re-run this workflow until the cause is understood (decision packet 3.4)."
            exit 2
          fi
          # Safe side: a watcher that crashed, never ran, or is still running did not observe the upgrade.
          if [ "$WATCH_RC" != "0" ]; then
            echo "::error::readyz watch for golyat-4 did not complete (exit code: ${WATCH_RC}). The upgrade was not observed; treat as HALT and investigate watch.log before dispatching the next node."
            exit 1
          fi
          VERDICT=$(jq -r '.verdict' "$READYZ_WATCH_DIR/readyz-summary.json" 2>/dev/null || echo missing)
          if [ "$VERDICT" != "ok" ]; then
            echo "::error::readyz watch for golyat-4 ended with verdict '${VERDICT}' (expected ok)."
            exit 1
          fi
          echo "::notice::readyz watch for golyat-4 finished without HALT"

      - name: Upload readyz watch artifact
        if: always() && inputs.readyz_watch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readyz-watch-golyat-4
          path: |
            /tmp/readyz-watch/readyz-samples.jsonl
            /tmp/readyz-watch/readyz-events.jsonl
            /tmp/readyz-watch/readyz-summary.json
            /tmp/readyz-watch/HALT
            /tmp/readyz-watch/watch.log
          if-no-files-found: warn
          retention-days: 30


  post-check:
    name: Post-upgrade Validation
    needs: [pre-check, upgrade-cp-1, upgrade-cp-2, upgrade-cp-3, upgrade-worker-1, upgrade-worker-2, upgrade-worker-3, upgrade-worker-4]
    if: always() && !cancelled() && needs.pre-check.result == 'success' && (needs.upgrade-cp-1.result == 'success' || needs.upgrade-cp-1.result == 'skipped') && (needs.upgrade-cp-2.result == 'success' || needs.upgrade-cp-2.result == 'skipped') && (needs.upgrade-cp-3.result == 'success' || needs.upgrade-cp-3.result == 'skipped') && (needs.upgrade-worker-1.result == 'success' || needs.upgrade-worker-1.result == 'skipped') && (needs.upgrade-worker-2.result == 'success' || needs.upgrade-worker-2.result == 'skipped') && (needs.upgrade-worker-3.result == 'success' || needs.upgrade-worker-3.result == 'skipped') && (needs.upgrade-worker-4.result == 'success' || needs.upgrade-worker-4.result == 'skipped') && (needs.upgrade-cp-1.result == 'success' || needs.upgrade-cp-2.result == 'success' || needs.upgrade-cp-3.result == 'success' || needs.upgrade-worker-1.result == 'success' || needs.upgrade-worker-2.result == 'success' || needs.upgrade-worker-3.result == 'success' || needs.upgrade-worker-4.result == 'success')
    runs-on: ubuntu-latest
    # setup + health check (~15 min) + readyz observation window (readyz_observe_minutes, max 60) + upload
    timeout-minutes: 100
    permissions:
      id-token: write
      contents: read
    env:
      K8S_VERSION: ${{ inputs.kubernetes_version }}
      K8S_PACKAGE: ${{ inputs.kubernetes_package }}
      CRIO_VERSION: ${{ inputs.crio_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::839695154978:role/GitHubActions_Ansible_Apply
          aws-region: ap-northeast-1

      - name: Setup Cloudflare credentials
        id: cf-credentials
        run: |
          CF_ID=""
          for i in 1 2 3; do
            CF_ID=$(aws ssm get-parameter --name "bastion-cf-access-client-id" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_ID"
            sleep 5
          done
          if [ -z "$CF_ID" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_ID after 3 attempts"
            exit 1
          fi

          CF_SECRET=""
          for i in 1 2 3; do
            CF_SECRET=$(aws ssm get-parameter --name "bastion-cf-access-client-secret" --with-decryption --query "Parameter.Value" --output text) && break
            echo "Retry $i: Failed to get CF_ACCESS_CLIENT_SECRET"
            sleep 5
          done
          if [ -z "$CF_SECRET" ]; then
            echo "::error::Failed to retrieve CF_ACCESS_CLIENT_SECRET after 3 attempts"
            exit 1
          fi

          echo "::add-mask::$CF_ID"
          echo "::add-mask::$CF_SECRET"
          echo "CF_ACCESS_CLIENT_ID=$CF_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
          working_directory: aqua

      - name: Setup SSH config
        run: |
          cat >> ~/.ssh/config << EOF
          Host bastion
            HostName bastion.b0xp.io
            User ansible
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
            StrictHostKeyChecking accept-new
          EOF

          for NODE_IP in $ALL_NODE_IPS; do
            cat >> ~/.ssh/config << EOF

          Host ${NODE_IP}
            HostName ${NODE_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF
          done

          chmod 600 ~/.ssh/config

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          cd ansible
          uv sync

      - name: Verify cluster health
        run: |
          cd ansible
          source .venv/bin/activate
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--check"
          fi
          POST_CHECK_LIMIT="control_plane"
          if [ "${{ inputs.target_node }}" != "all" ]; then
            POST_CHECK_LIMIT="${{ inputs.target_node }}"
          fi
          echo "Running post-upgrade cluster health check"
          ansible-playbook \
            -i inventories/production/hosts.yml \
            playbooks/upgrade-k8s.yml \
            --tags health_check \
            --limit "${POST_CHECK_LIMIT}" \
            -e "ansible_ssh_common_args=''" \
            -e "kubernetes_upgrade_version=${K8S_VERSION}" \
            ${DRY_RUN_FLAG} \
            -v

      - name: Setup SSH config for readyz probe hosts
        if: inputs.readyz_watch
        run: |
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_IP=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')
            cat >> ~/.ssh/config << EOF

          Host readyz-${CP_NAME}
            HostName ${CP_IP}
            User boxp
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump bastion
            StrictHostKeyChecking accept-new
          EOF
          done
          chmod 600 ~/.ssh/config

      - name: Post-upgrade readyz observation
        if: inputs.readyz_watch
        env:
          OBSERVE_MINUTES: ${{ inputs.readyz_observe_minutes }}
          TARGET_NODE: ${{ inputs.target_node }}
        run: |
          # BOXP-213 (BOXP-194 A2/D2): observe VIP + 3 CP readyz after the node finished upgrading.
          # Default window: control plane 30 min, golyat-4 (GPU worker) 30 min, other workers 15 min.
          if [ -z "$OBSERVE_MINUTES" ]; then
            case "$TARGET_NODE" in
              shanghai-*|golyat-4) OBSERVE_MINUTES=30 ;;
              *) OBSERVE_MINUTES=15 ;;
            esac
          fi
          if ! [[ "$OBSERVE_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::readyz_observe_minutes must be an integer between 0 and 60 (got '$OBSERVE_MINUTES'); the job timeout only covers a 60 minute window"
            exit 1
          fi
          # Force base-10: a leading zero (e.g. "08") would otherwise be read as octal by $(( )).
          OBSERVE_MINUTES=$((10#${OBSERVE_MINUTES}))
          if [ "$OBSERVE_MINUTES" -gt 60 ]; then
            echo "::error::readyz_observe_minutes must be an integer between 0 and 60 (got '$OBSERVE_MINUTES'); the job timeout only covers a 60 minute window"
            exit 1
          fi
          if [ "$OBSERVE_MINUTES" -eq 0 ]; then
            echo "readyz observation skipped (readyz_observe_minutes=0)"
            exit 0
          fi
          mkdir -p "$READYZ_WATCH_DIR"
          CP_ARGS=()
          for CP_NAME in $CONTROL_PLANE_NODES; do
            CP_ARGS+=(--cp "${CP_NAME}=$(echo "$NODE_IPS" | jq -r --arg n "$CP_NAME" '.[$n]')")
          done
          echo "Observing readyz for ${OBSERVE_MINUTES} minutes after upgrading ${TARGET_NODE}"
          set +e
          READYZ_SSH_HOST_PREFIX=readyz- scripts/upgrade-k8s/readyz-watch.sh \
            --vip "vip=${CLUSTER_VIP}" \
            "${CP_ARGS[@]}" \
            --interval 30 \
            --halt-after 180 \
            --duration $((OBSERVE_MINUTES * 60)) \
            --out-dir "$READYZ_WATCH_DIR" 2>&1 | tee "$READYZ_WATCH_DIR/watch.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "::group::readyz summary"
          cat "$READYZ_WATCH_DIR/readyz-summary.json" 2>/dev/null || echo "(no summary)"
          echo "::endgroup::"
          if [ "$RC" -eq 2 ] || [ -f "$READYZ_WATCH_DIR/HALT" ]; then
            echo "::error::HALT (BOXP-194 H2) during post-upgrade observation after ${TARGET_NODE}: $(cat "$READYZ_WATCH_DIR/HALT" 2>/dev/null). Do NOT dispatch the next node (decision packet 3.4)."
            exit 2
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::readyz-watch exited with code ${RC}"
            exit "$RC"
          fi
          echo "::notice::post-upgrade readyz observation after ${TARGET_NODE} finished without HALT"

      - name: Upload readyz observation artifact
        if: always() && inputs.readyz_watch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readyz-observation-${{ inputs.target_node }}
          path: |
            /tmp/readyz-watch/readyz-samples.jsonl
            /tmp/readyz-watch/readyz-events.jsonl
            /tmp/readyz-watch/readyz-summary.json
            /tmp/readyz-watch/HALT
            /tmp/readyz-watch/watch.log
          if-no-files-found: warn
          retention-days: 30
