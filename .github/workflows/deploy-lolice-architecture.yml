name: Deploy lolice-architecture

# Manual only. The private page reaches this job through an environment secret
# that GitHub hands out on main alone, and only while a deploy is in progress.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: placeholder deploys a stub page, html deploys the private page
        required: true
        type: choice
        options: [placeholder, html]
      expected_sha256:
        description: sha256 of the private page (html mode)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-lolice-architecture
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'boxp/arch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: lolice-architecture-deploy
    defaults:
      run:
        working-directory: apps/lolice-architecture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - run: npm ci
      - run: npm test

      - name: Restore the private page
        if: inputs.mode == 'html'
        env:
          # One secret holds at most 48 KB, so a larger page arrives in ordered parts.
          PAGE_XZ_B64_1: ${{ secrets.LOLICE_ARCHITECTURE_HTML_XZ_B64 }}
          PAGE_XZ_B64_2: ${{ secrets.LOLICE_ARCHITECTURE_HTML_XZ_B64_2 }}
          PAGE_XZ_B64_3: ${{ secrets.LOLICE_ARCHITECTURE_HTML_XZ_B64_3 }}
          PAGE_XZ_B64_4: ${{ secrets.LOLICE_ARCHITECTURE_HTML_XZ_B64_4 }}
        run: |
          set -o pipefail
          [ -n "$PAGE_XZ_B64_1" ] || { echo "LOLICE_ARCHITECTURE_HTML_XZ_B64 is not set" >&2; exit 1; }
          umask 077
          mkdir "$RUNNER_TEMP/page"
          printf '%s' "$PAGE_XZ_B64_1" "$PAGE_XZ_B64_2" "$PAGE_XZ_B64_3" "$PAGE_XZ_B64_4" \
            | base64 -d | xz -dc > "$RUNNER_TEMP/page/lolice-architecture.html"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ "$MODE" = html ]; then
            [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "expected_sha256 must be 64 hex digits" >&2; exit 1; }
            scripts/deploy.sh --html "$RUNNER_TEMP/page/lolice-architecture.html" --expect-sha256 "$EXPECTED_SHA256"
          else
            scripts/deploy.sh --placeholder
          fi

      - name: Remove the page from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/page" public .wrangler "$HOME/.config/.wrangler"

      - name: Read back the deployment and test every alternate path
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/readback.sh
