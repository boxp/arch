---
name: pull_request_target
on: pull_request_target

concurrency:
  group: ${{ github.workflow }}--${{ github.head_ref }} # github.ref is unavailable in case of pull_request_target
  cancel-in-progress: true

permissions: {}

jobs:
  path-filter:
    uses: ./.github/workflows/wc-path-filter.yaml
    permissions: {}
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}

  disable-auto-merge:
    # BOXP-651: Renovate enables auto-merge when it creates the PR. Disable it at
    # the start of every run so that the PR cannot be merged as soon as the
    # required status-check passes, before the enable-auto-merge job has judged
    # the plan results (e.g. when the plan result artifacts cannot be read).
    # Auto-merge is enabled again only by enable-auto-merge when every target has
    # no changes. status-check needs this job, so it cannot pass before this
    # job has finished, and fails if this job fails.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    if: |
      github.event.pull_request.user.login == 'renovate[bot]'
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{secrets.APP_ID}}
          private_key: ${{secrets.APP_PRIVATE_KEY}}
          # pull_requests:write - Disable auto-merge
          # contents:write - disablePullRequestAutoMerge is rejected with
          #   "Resource not accessible by integration" without it (BOXP-651)
          permissions: >-
            {
              "pull_requests": "write",
              "contents": "write"
            }
          repositories: >-
            ["${{github.event.repository.name}}"]

      - name: Disable auto-merge until the plan results are judged
        run: |
          set -euo pipefail
          if [[ "$(gh -R "$GITHUB_REPOSITORY" pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" == true ]]; then
            gh -R "$GITHUB_REPOSITORY" pr merge --disable-auto "$PR_NUMBER"
            echo "Disabled auto-merge until the enable-auto-merge job judges the plan results."
          fi
        env:
          GITHUB_TOKEN: ${{steps.generate_token.outputs.token}}
          PR_NUMBER: ${{github.event.pull_request.number}}

  enable-auto-merge:
    # This job is used for main branch's branch protection rule's status check.
    # If all dependent jobs succeed or are skipped this job succeeds.
    # BOXP-651: auto-merge is enabled only when the tfaction plan of every target
    # in this run has no changes. See wc-enable-auto-merge.yaml.
    # It also runs when test or status-check failed, so that it can keep
    # auto-merge disabled (Renovate enables it when it creates the PR).
    # status-check is the required check, so this job does not gate merging.
    uses: ./.github/workflows/wc-enable-auto-merge.yaml
    needs:
      - disable-auto-merge
      - status-check
      - test
    permissions:
      actions: read
      contents: read
    with:
      plan_targets: ${{needs.test.outputs.targets}}
      upstream_ok: ${{needs.test.result == 'success' && needs.status-check.result != 'failure'}}
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}
    if: |
      ! cancelled() && github.event.pull_request.user.login == 'renovate[bot]' && contains(github.event.pull_request.body, ' **Automerge**: Enabled.')

  # This job is used for branch protection rule
  # Add this job to `Status checks that are required`
  status-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - adr
      - conftest-verify
      - disable-auto-merge
      - hide-comment
      - lock-model
      - opa-fmt
      - renovate-config-validator
      - test
      - test-ansible
      - update-aqua-checksums
    if: failure()
    steps:
      - run: exit 1

  adr:
    # ADR の構造検査と Rego lint。全 PR で実行する。LLM は呼ばず secret も渡さない。
    uses: ./.github/workflows/wc-adr.yaml
    needs: path-filter
    permissions:
      contents: read
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}

  conftest-verify:
    uses: ./.github/workflows/wc-conftest-verify.yaml
    needs: path-filter
    if: |
      needs.path-filter.outputs.conftest-verify == 'true'
    permissions:
      contents: read
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}

  ghalint:
    uses: ./.github/workflows/wc-ghalint.yaml
    needs: path-filter
    if: |
      needs.path-filter.outputs.ghalint == 'true'
    permissions:
      contents: read
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}

  hide-comment:
    uses: ./.github/workflows/wc-hide-comment.yaml
    needs: path-filter
    permissions:
      contents: read
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}

  opa-fmt:
    uses: ./.github/workflows/wc-opa-fmt.yaml
    needs: path-filter
    if: |
      needs.path-filter.outputs.opa-fmt == 'true'
    permissions:
      contents: read
      pull-requests: write
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}

  renovate-config-validator:
    uses: ./.github/workflows/wc-renovate-config-validator.yaml
    needs: path-filter
    if: needs.path-filter.outputs.renovate-config-validator == 'true'
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/wc-test.yaml
    needs: path-filter
    permissions:
      id-token: write
      contents: read
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}
      gh_cloudflare_api_token: ${{secrets.CLOUDFLARE_API_TOKEN}}

  test-ansible:
    uses: ./.github/workflows/test-ansible.yml
    needs: path-filter
    if: |
      needs.path-filter.outputs.test-ansible == 'true'
    permissions:
      contents: read
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}

  lock-model:
    # BOXP-652 / BOXP-673: the Lean models of the Task Board runner. `lean` checks the
    # proofs and the generated operation sequences (filter lock-model: a model changed);
    # `replay` runs the sequences against the runner's real functions (filter
    # model-replay: a model, a replay test or the runner changed). status-check needs
    # this job, so a failure of either blocks the merge. It is skipped (and status-check
    # is not affected) when the PR changes none of those paths. No secret is passed.
    uses: ./.github/workflows/test-task-board-lock-model.yml
    needs: path-filter
    if: |
      needs.path-filter.outputs.lock-model == 'true' ||
      needs.path-filter.outputs.model-replay == 'true'
    permissions:
      contents: read
    with:
      ref: ${{needs.path-filter.outputs.merge_commit_sha}}
      lean: ${{needs.path-filter.outputs.lock-model == 'true'}}
      replay: ${{needs.path-filter.outputs.model-replay == 'true'}}

  update-aqua-checksums:
    uses: ./.github/workflows/wc-update-aqua-checksums.yaml
    needs: path-filter
    if: needs.path-filter.outputs.update-aqua-checksums == 'true'
    permissions:
      contents: write
    secrets:
      gh_app_id: ${{secrets.APP_ID}}
      gh_app_private_key: ${{secrets.APP_PRIVATE_KEY}}
