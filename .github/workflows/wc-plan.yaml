---
name: plan
on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      gh_app_id:
        required: true
      gh_app_private_key:
        required: true
      gh_cloudflare_api_token:
        required: true

jobs:
  plan:
    name: "plan (${{matrix.target.target}})"
    runs-on: ${{matrix.target.runs_on}}
    timeout-minutes: 30
    permissions:
      id-token: write # For OIDC
      contents: read # To checkout private repositories
    env:
      TFACTION_TARGET: ${{matrix.target.target}}
      TFACTION_JOB_TYPE: ${{matrix.target.job_type}}
      TFACTION_SKIP_TERRAFORM: ${{matrix.target.skip_terraform}}
      # Tailscale WIF (BOXP-200): Tailscale targets authenticate only with the
      # read-only trust credential named by the non-secret client ID variable.
      # Tailscale generates the audience from the client ID.
      TAILSCALE_OAUTH_CLIENT_ID: ${{ startsWith(matrix.target.target, 'terraform/tailscale/') && vars.TAILSCALE_WIF_CI_PLAN_CLIENT_ID || '' }}
      TAILSCALE_AUDIENCE: ${{ startsWith(matrix.target.target, 'terraform/tailscale/') && vars.TAILSCALE_WIF_CI_PLAN_CLIENT_ID != '' && format('api.tailscale.com/{0}', vars.TAILSCALE_WIF_CI_PLAN_CLIENT_ID) || '' }}
      GH_COMMENT_SHA1: ${{inputs.ref}}
      TFCMT_SHA: ${{inputs.ref}}
    strategy:
      fail-fast: true
      matrix:
        target: ${{fromJSON(inputs.targets)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.ref}}
          persist-credentials: false

      - name: Generate token (aqua)
        id: aqua_installer_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{secrets.gh_app_id}}
          private_key: ${{secrets.gh_app_private_key}}
          permissions: >-
            {}
          repositories: >-
            []

      # Privileged jobs must not approve registry/policy files supplied by a PR.
      - name: Checkout trusted aqua definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{github.event.pull_request.base.sha || github.sha}}
          path: .trusted-aqua
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aqua/registry.yaml
            aqua/aqua-policy.yaml

      - name: Use trusted aqua definitions
        run: |
          cp .trusted-aqua/aqua/registry.yaml aqua/registry.yaml
          cp .trusted-aqua/aqua/aqua-policy.yaml aqua/aqua-policy.yaml
          rm -rf .trusted-aqua

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1
          policy_allow: aqua/aqua-policy.yaml
        env:
          AQUA_GITHUB_TOKEN: ${{steps.aqua_installer_token.outputs.token}}

      - name: Generate token to download private Terraform Modules
        id: gh_setup_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.gh_app_id }}
          private_key: ${{ secrets.gh_app_private_key }}
          # If you use private registries, contents:read is required
          permissions: >-
            {
              "contents": "read"
            }
          # private repositories hosting private modules
          repositories: >-
            []

      # This is required to download private modules in `terraform init`
      - run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{steps.gh_setup_token.outputs.token}}

      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{secrets.gh_app_id}}
          private_key: ${{secrets.gh_app_private_key}}
          # issues:write - Create labels
          # pull_requests:write - Post comments and set labels
          # contents:write - Push commits
          permissions: >-
            {
              "pull_requests": "write",
              "issues": "write",
              "contents": "write"
            }
          repositories: >-
            ["${{github.event.repository.name}}"]

      - uses: suzuki-shunsuke/tfaction@7e6ae7e4e2aa17f869f970f7fec8aa4b9de19138 # v2.3.5
        id: setup
        with:
          action: setup
          github_token: ${{steps.generate_token.outputs.token}}
          # No target needs a GitHub Secret here (BOXP-207). If one does, pass a JSON
          # object with only the required names instead of the whole secrets context.
          secrets: '{}'
        env:
          GITHUB_TOKEN: ${{steps.generate_token.outputs.token}} # For GitHub Provider

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.setup.outputs.aws_assume_role_arn != ''
        with:
          role-to-assume: ${{ steps.setup.outputs.aws_assume_role_arn }}
          role-session-name: ${{ steps.setup.outputs.aws_role_session_name }}
          aws-region: ${{ steps.setup.outputs.aws_region }}

      - uses: suzuki-shunsuke/tfaction@7e6ae7e4e2aa17f869f970f7fec8aa4b9de19138 # v2.3.5
        id: target-config

        with:
          action: get-target-config

      - uses: suzuki-shunsuke/tfaction@7e6ae7e4e2aa17f869f970f7fec8aa4b9de19138 # v2.3.5
        with:
          action: terraform-init
          github_token: ${{steps.generate_token.outputs.token}}
          # No target needs a GitHub Secret here (BOXP-207). If one does, pass a JSON
          # object with only the required names instead of the whole secrets context.
          secrets: '{}'
      - name: Generate token (pull request write)
        id: pull_request_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{secrets.gh_app_id}}
          private_key: ${{secrets.gh_app_private_key}}
          permissions: >-
            {
              "pull_requests": "write"
            }
          repositories: >-
            ["${{github.event.repository.name}}"]

      - run: |
          set -euo pipefail
          tfprovidercheck -v
          github-comment exec -- terraform version -json | github-comment exec -- tfprovidercheck
        working-directory: ${{ steps.target-config.outputs.working_directory }}
        env:
          TFPROVIDERCHECK_CONFIG_BODY: |
            providers:
              - name: registry.terraform.io/cloudflare/cloudflare
              - name: registry.terraform.io/hashicorp/aws
              - name: registry.terraform.io/hashicorp/google
              - name: registry.terraform.io/hashicorp/null
              - name: registry.terraform.io/hashicorp/tls
              - name: registry.terraform.io/hashicorp/random
              - name: registry.terraform.io/hashicorp/time
              - name: registry.terraform.io/integrations/github
              - name: registry.terraform.io/oracle/oci
              - name: registry.terraform.io/tailscale/tailscale
          GITHUB_TOKEN: ${{steps.pull_request_token.outputs.token}} # For github-comment

      - uses: suzuki-shunsuke/tfaction@7e6ae7e4e2aa17f869f970f7fec8aa4b9de19138 # v2.3.5
        with:
          action: test
          github_token: ${{steps.generate_token.outputs.token}}
          # No target needs a GitHub Secret here (BOXP-207). If one does, pass a JSON
          # object with only the required names instead of the whole secrets context.
          secrets: '{}'
        env:
          GITHUB_TOKEN: ${{steps.generate_token.outputs.token}} # For GitHub Provider and reviewdog and github-comment
          CLOUDFLARE_API_TOKEN: ${{secrets.gh_cloudflare_api_token}} # For cloudflare provider
          TRIVY_IGNOREFILE: ${{ github.workspace }}/.trivyignore

      - uses: suzuki-shunsuke/tfaction@7e6ae7e4e2aa17f869f970f7fec8aa4b9de19138 # v2.3.5
        id: plan
        with:
          action: plan
          github_token: ${{steps.generate_token.outputs.token}}
          # No target needs a GitHub Secret here (BOXP-207). If one does, pass a JSON
          # object with only the required names instead of the whole secrets context.
          secrets: '{}'
        env:
          GITHUB_TOKEN: ${{steps.generate_token.outputs.token}} # For GitHub Provider and tfcmt and github-comment
          CLOUDFLARE_API_TOKEN: ${{secrets.gh_cloudflare_api_token}} # For cloudflare provider

      # BOXP-651: Record this target's plan result for the enable-auto-merge job.
      # tfaction disables auto-merge when a Renovate PR has plan changes, and the
      # enable-auto-merge job must not enable it again. Record the result even
      # when the plan failed or was skipped so that the result of a re-run
      # overwrites the result of an earlier attempt.
      - name: Record plan result for auto-merge decision
        if: always() && github.event_name == 'pull_request_target'
        id: plan_result
        run: |
          set -euo pipefail
          slug="${TFACTION_TARGET//\//__}"
          dir="${RUNNER_TEMP}/tfaction-plan-result"
          mkdir -p "$dir"
          jq -n --arg target "$TFACTION_TARGET" --arg outcome "$PLAN_OUTCOME" --arg exitcode "$PLAN_DETAILED_EXITCODE" \
            '{target: $target, outcome: $outcome, detailed_exitcode: $exitcode}' > "${dir}/${slug}.json"
          cat "${dir}/${slug}.json"
          echo "artifact_name=tfaction-plan-result-${slug}" >> "$GITHUB_OUTPUT"
          echo "file=${dir}/${slug}.json" >> "$GITHUB_OUTPUT"
        env:
          PLAN_OUTCOME: ${{steps.plan.outcome}}
          PLAN_DETAILED_EXITCODE: ${{steps.plan.outputs.detailed_exitcode}}

      # BOXP-651: Renovate enables auto-merge when it creates the PR. tfaction
      # disables it only when the plan has changes, so a target whose plan was
      # skipped (skip_terraform, e.g. a skip:<target> label) or whose result is
      # undetermined would keep auto-merge enabled, and the PR could be merged
      # as soon as the required status-check passes, before the
      # enable-auto-merge job runs. Disable it here, inside the plan job, so
      # that it happens before status-check can complete.
      - name: Disable auto-merge unless the plan has no changes
        if: |
          always() &&
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          !(steps.plan.outcome == 'success' && steps.plan.outputs.detailed_exitcode == '0')
        run: |
          set -euo pipefail
          if [[ "$(gh -R "$GITHUB_REPOSITORY" pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" == true ]]; then
            gh -R "$GITHUB_REPOSITORY" pr merge --disable-auto "$PR_NUMBER"
          fi
          echo "::warning::Auto-merge is disabled because the plan of ${TFACTION_TARGET} did not finish with no changes (outcome=${PLAN_OUTCOME}, detailed_exitcode=${PLAN_DETAILED_EXITCODE:-<empty>})."
        env:
          GITHUB_TOKEN: ${{steps.generate_token.outputs.token}}
          PR_NUMBER: ${{github.event.pull_request.number}}
          PLAN_OUTCOME: ${{steps.plan.outcome}}
          PLAN_DETAILED_EXITCODE: ${{steps.plan.outputs.detailed_exitcode}}

      - name: Upload plan result for auto-merge decision
        if: always() && steps.plan_result.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{steps.plan_result.outputs.artifact_name}}
          path: ${{steps.plan_result.outputs.file}}
          overwrite: true
          retention-days: 7
          if-no-files-found: error

      - name: Create Renovate plan follow-up PR
        if: |
          failure() &&
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == 'renovate[bot]'
        run: ${{ github.workspace }}/.github/scripts/create-renovate-plan-follow-up-pr.sh
        env:
          GITHUB_TOKEN: ${{steps.generate_token.outputs.token}}
          PR_NUMBER: ${{github.event.pull_request.number}}
          BASE_REF: ${{github.event.pull_request.base.ref}}
