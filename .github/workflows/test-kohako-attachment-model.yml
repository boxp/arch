name: Test Kohako Attachment Model

# BOXP-677: Lean model of the kohako-home attachment limits and upload outcomes
# (apps/kohako-studio/bff/contract/attachment-model/). It checks the proofs (no sorry, no
# added axiom), that cases.jsonl and the web copy are what the model generates, and that
# nginx's client_max_body_size for the attachment route is the model's proxy limit.
# The implementation replay of cases.jsonl runs in the bff/web unit tests (Docker build).
# Not a required check yet: the required Lean path is being generalised in BOXP-673.

on:
  pull_request:
    paths:
      - apps/kohako-studio/bff/contract/attachment-model/**
      - apps/kohako-studio/web/src/home/attachment-cases.jsonl
      - apps/kohako-studio/nginx.conf
      - .github/workflows/test-kohako-attachment-model.yml
  workflow_dispatch: {}

permissions: {}

jobs:
  lean:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Install Lean
        timeout-minutes: 8
        working-directory: apps/kohako-studio/bff/contract/attachment-model
        run: |
          set -euo pipefail
          toolchain="$(cat lean-toolchain)"
          sha256="$(cat lean-linux.tar.zst.sha256)"
          if ! [[ "${toolchain}" =~ ^leanprover/lean4:v([0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?)$ ]]; then
            echo "::error::lean-toolchain is not leanprover/lean4:vX.Y.Z"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! [[ "${sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::lean-linux.tar.zst.sha256 is not a sha256"
            exit 1
          fi
          tmp="${RUNNER_TEMP}/lean"
          mkdir -p "${tmp}"
          curl --retry 5 --retry-all-errors --connect-timeout 30 --max-time 400 -fsSL \
            "https://github.com/leanprover/lean4/releases/download/v${version}/lean-${version}-linux.tar.zst" \
            -o "${tmp}/lean.tar.zst"
          echo "${sha256}  ${tmp}/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "${tmp}/lean.tar.zst" -C "${tmp}"
          rm "${tmp}/lean.tar.zst"
          echo "${tmp}/lean-${version}-linux/bin" >>"${GITHUB_PATH}"
      - name: Check proofs, generated cases and the proxy limit
        timeout-minutes: 8
        working-directory: apps/kohako-studio/bff/contract/attachment-model
        run: |
          set -uo pipefail
          status=0
          out="${RUNNER_TEMP}/attachment-model-olean"
          mkdir -p "${out}"
          cat >"${RUNNER_TEMP}/AttachmentModelAxioms.lean" <<'LEAN'
          import Lean
          import AttachmentModel
          open Lean

          #eval show CoreM Unit from do
            let allowed : List Name := [``propext, ``Classical.choice, ``Quot.sound]
            let env ← getEnv
            let some idx := env.getModuleIdx? `AttachmentModel
              | throwError "module AttachmentModel is not loaded"
            let mut theorems := 0
            let mut bad : Array String := #[]
            for (name, info) in env.constants.map₁.toList do
              if env.getModuleIdxFor? name != some idx then continue
              if info matches .thmInfo _ then theorems := theorems + 1
              let extra := (← collectAxioms name).toList.filter (!allowed.contains ·)
              unless extra.isEmpty do
                bad := bad.push s!"{name} depends on {extra}"
            IO.println s!"theorems: {theorems}"
            unless bad.isEmpty do
              throwError "not proved from the standard axioms only:\n{"\n".intercalate bad.qsort.toList}"
            if theorems == 0 then throwError "AttachmentModel has no theorem"
          LEAN
          lean -o "${out}/AttachmentModel.olean" AttachmentModel.lean || status=1
          if [ "${status}" -eq 0 ]; then
            env LEAN_PATH="${out}" lean "${RUNNER_TEMP}/AttachmentModelAxioms.lean" || status=1
          fi
          lean --run AttachmentModel.lean >"${RUNNER_TEMP}/cases.jsonl" || status=1
          cmp "${RUNNER_TEMP}/cases.jsonl" cases.jsonl || { echo "::error::cases.jsonl differs from what AttachmentModel.lean generates"; status=1; }
          cmp cases.jsonl ../../../web/src/home/attachment-cases.jsonl || { echo "::error::web/src/home/attachment-cases.jsonl is not a copy of cases.jsonl"; status=1; }
          # proxyMax = 31 MiB in the model; nginx must say the same for the attachment route.
          grep -Eq 'location = /kohako/api/v1/attachments \{ client_max_body_size 31m;' ../../../nginx.conf || { echo "::error::nginx client_max_body_size for attachments is not the model's proxyMax (31m)"; status=1; }
          exit "${status}"
