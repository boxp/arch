---
name: aqua github-comment signature regression
on:
  pull_request:
    paths:
      - aqua/**
      - tests/aqua/**
      - .github/workflows/aqua-github-comment.yaml
  push:
    branches: [main]
    paths:
      - aqua/**
      - tests/aqua/**
      - .github/workflows/aqua-github-comment.yaml
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          enable_aqua_install: "false"
      - name: Verify signed checksums, real installs and rejection cases
        run: python3 tests/aqua/test_github_comment.py
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
