name: Build codex for armv7 (IS01)

# @openai/codex の公式配布は linux-x64 と linux-arm64 のみで 32bit ARM が無い。
# IS01 (ARMv7 / Debian bookworm armhf) 用にクロスビルドする。
# 32bit 固有の壁が 3 つあり、アップデートのたびに手で直すのは現実的でないため
# 変換を自動化している。詳細は docker/codex-armv7/README.md を参照。

on:
  # Renovate が docker/codex-armv7/codex-version.env を更新して merge されたら
  # 自動でビルドする。codex は更新が速く、そのたびに手で回すのは現実的でない。
  push:
    branches:
      - main
    paths:
      - 'docker/codex-armv7/codex-version.env'
      - 'docker/codex-armv7/Cross.toml'
      - '.github/workflows/build-codex-armv7.yml'
  workflow_dispatch:
    inputs:
      codex_ref:
        description: 'openai/codex の ref。空ならバージョンファイルに従う'
        required: false
        type: string
        default: ''
      make_release:
        description: 'GitHub Release を作る'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Checkout arch (Cross.toml のため)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: arch
          persist-credentials: false

      # 手動実行で ref を指定したときはそれを使い、無ければバージョンファイルに従う。
      # push で発火したときは常にバージョンファイル。
      - name: ビルドする ref を決める
        id: ref
        env:
          INPUT_REF: ${{ inputs.codex_ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "手動指定: $INPUT_REF"
          else
            v=$(grep -E '^CODEX_VERSION=' arch/docker/codex-armv7/codex-version.env | cut -d= -f2)
            test -n "$v" || { echo "::error::codex-version.env から版を取れない"; exit 1; }
            echo "ref=rust-v$v" >> "$GITHUB_OUTPUT"
            echo "バージョンファイル: rust-v$v"
          fi

      - name: Checkout openai/codex
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: openai/codex
          ref: ${{ steps.ref.outputs.ref }}
          path: codex
          persist-credentials: false

      - name: Rust ツールチェーンと cross
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          cargo install cross --git https://github.com/cross-rs/cross --locked

      # 🚨 壁 1: libc::SYS_* は 64bit では i64、32bit では i32。
      #    seccomp 側が i64 を要求するので型が合わない。
      #    パッチファイルだと upstream の変更で当たらなくなるため、変換で当てる。
      - name: 32bit のシステムコール番号を i64 へ寄せる
        working-directory: codex/codex-rs
        run: |
          f=linux-sandbox/src/landlock.rs
          test -f "$f" || { echo "::error::$f が無い。upstream の構成が変わった"; exit 1; }
          before=$(grep -c 'libc::SYS_' "$f")
          perl -pi -e 's/(libc::SYS_[A-Za-z0-9_]+)(?!\s+as\b)/$1 as i64/g' "$f"
          after=$(grep -c 'as i64' "$f")
          echo "libc::SYS_* $before 箇所 -> as i64 $after 箇所"
          test "$after" -ge "$before" || { echo "::error::変換できていない"; exit 1; }
          test "$(grep -c 'as i64 as i64' "$f")" = 0 || { echo "::error::二重キャスト"; exit 1; }

      # 🚨 壁 2: pagable は 32bit の想定サイズを wasm32 の実測値で決め打ちしており
      #    armv7 では表明が外れる。表明を wasm32 限定に緩めた複製へ差し替える。
      #    assert_eq_size! はコンパイル時のサイズ確認のみで実行時の意味を持たない。
      - name: pagable の 32bit サイズ表明を緩める
        working-directory: codex/codex-rs
        run: |
          ver=$(awk '/^name = "pagable"$/{f=1} f&&/^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          test -n "$ver" || { echo "::error::Cargo.lock から pagable の版を取れない"; exit 1; }
          echo "pagable $ver"
          mkdir -p "$RUNNER_TEMP/vendor"
          curl -sSfL "https://crates.io/api/v1/crates/pagable/$ver/download" -o "$RUNNER_TEMP/pagable.tar.gz"
          tar xzf "$RUNNER_TEMP/pagable.tar.gz" -C "$RUNNER_TEMP/vendor"
          src="$RUNNER_TEMP/vendor/pagable-$ver/src/pagable_arc.rs"
          test -f "$src" || { echo "::error::pagable_arc.rs が無い"; exit 1; }
          grep -q '#\[cfg(target_pointer_width = "32")\]' "$src" || {
            echo "::error::想定した cfg 行が無い。upstream が変わった"; exit 1; }
          perl -pi -e 's/#\[cfg\(target_pointer_width = "32"\)\]/#[cfg(all(target_pointer_width = "32", target_arch = "wasm32"))]/' "$src"
          rm -f "$RUNNER_TEMP/vendor/pagable-$ver/.cargo-checksum.json"
          # 🚨 YAML のブロックスカラーは相対インデントを保つ。ここで python の
          #    heredoc を使うと全行に空白が付いて IndentationError になる。
          #    1 行で完結する perl を使う。
          grep -q "^\[patch.crates-io\]" Cargo.toml || { echo "::error::[patch.crates-io] が無い"; exit 1; }
          PAGABLE_DIR="$RUNNER_TEMP/vendor/pagable-$ver" perl -pi -e 's{^\[patch\.crates-io\]$}{"[patch.crates-io]\npagable = { path = \"$ENV{PAGABLE_DIR}\" }"}e' Cargo.toml
          grep -q "^pagable = " Cargo.toml || { echo "::error::pagable の差し替えが入っていない"; exit 1; }
          grep -A1 '^\[patch.crates-io\]' Cargo.toml | head -2

      # 🚨 壁 3: 既定イメージは glibc 2.38/2.39 に対してリンクする。
      #    実機の Debian bookworm は 2.36 なので起動できない。古いイメージに固定。
      - name: Cross.toml を置く
        run: cp arch/docker/codex-armv7/Cross.toml codex/codex-rs/Cross.toml

      - name: クロスビルド
        working-directory: codex/codex-rs
        run: cross build --release -p codex-cli --target armv7-unknown-linux-gnueabihf

      - name: 検証と圧縮
        working-directory: codex/codex-rs
        run: |
          bin=target/armv7-unknown-linux-gnueabihf/release/codex
          file "$bin" | tee /dev/stderr | grep -q "ELF 32-bit LSB.*ARM" ||
            { echo "::error::armv7 バイナリになっていない"; exit 1; }
          # 🚨 実機の glibc は 2.36。それより新しい要求が残っていたら弾く。
          if strings "$bin" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1 |
             awk -F. '{ if ($2+0 > 36) exit 0; else exit 1 }'; then
            echo "::error::glibc 2.36 より新しい要求が残っている"
            strings "$bin" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -3
            exit 1
          fi
          cp "$bin" "$RUNNER_TEMP/codex-armv7"
          docker run --rm -v "$RUNNER_TEMP:/w" ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:0.2.5 \
            arm-linux-gnueabihf-strip /w/codex-armv7
          gzip -9 -c "$RUNNER_TEMP/codex-armv7" > "$RUNNER_TEMP/codex-armv7.gz"
          ls -lh "$RUNNER_TEMP/codex-armv7" "$RUNNER_TEMP/codex-armv7.gz"
          sha256sum "$RUNNER_TEMP/codex-armv7.gz" | tee "$RUNNER_TEMP/codex-armv7.gz.sha256"

      - name: 成果物を上げる
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-armv7-${{ steps.ref.outputs.ref }}
          path: |
            ${{ runner.temp }}/codex-armv7.gz
            ${{ runner.temp }}/codex-armv7.gz.sha256
          retention-days: 30

      - name: Release を作る
        if: ${{ inputs.make_release || github.event_name == 'push' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: codex-armv7-${{ steps.ref.outputs.ref }}
          files: |
            ${{ runner.temp }}/codex-armv7.gz
            ${{ runner.temp }}/codex-armv7.gz.sha256
