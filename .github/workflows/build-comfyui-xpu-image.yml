name: Build ComfyUI XPU Image

on:
  push:
    branches: [main]
    paths: ['docker/comfyui-xpu/**', '.github/workflows/build-comfyui-xpu-image.yml']
  pull_request:
    paths: ['docker/comfyui-xpu/**', '.github/workflows/build-comfyui-xpu-image.yml']
  workflow_dispatch:
    inputs:
      comfyui_repo:
        description: 'ComfyUI source repository'
        required: true
        default: 'https://github.com/comfyanonymous/ComfyUI.git'
      comfyui_ref:
        description: 'ComfyUI source ref (empty: the tag pinned in the Dockerfile)'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve source
        id: source
        env:
          INPUT_COMFYUI_REPO: ${{ inputs.comfyui_repo }}
          INPUT_COMFYUI_REF: ${{ inputs.comfyui_ref }}
        run: |
          repo="${INPUT_COMFYUI_REPO:-https://github.com/comfyanonymous/ComfyUI.git}"
          ref="${INPUT_COMFYUI_REF:-$(sed -n 's/^ARG COMFYUI_REF=//p' docker/comfyui-xpu/Dockerfile)}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/boxp/arch/comfyui-xpu
          tags: |
            type=raw,value={{date 'YYYYMMDDHHmm'}},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/comfyui-xpu
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            COMFYUI_REPO=${{ steps.source.outputs.repo }}
            COMFYUI_REF=${{ steps.source.outputs.ref }}
