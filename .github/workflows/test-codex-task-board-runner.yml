name: Test Codex Task Board Runner

on:
  pull_request:
    paths:
      - docker/codex-workspace/Dockerfile
      - docker/codex-workspace/cron/**
      - docker/codex-workspace/entrypoint.sh
      - docker/codex-workspace/qwen-eval/**
      - tests/qwen-eval/**
      - docker/codex-workspace/task-board/**
      - docker/codex-workspace/novel-board/**
      - docker/codex-workspace/recurring-events/**
      - docker/hermes-agent/skills/obsidian-task-board/**
      - tests/codex-workspace/**
      - docs/project_docs/BOXP-360/tools/**
      - .github/workflows/test-codex-task-board-runner.yml
  push:
    branches: [main]
    paths:
      - docker/codex-workspace/Dockerfile
      - docker/codex-workspace/cron/**
      - docker/codex-workspace/entrypoint.sh
      - docker/codex-workspace/qwen-eval/**
      - tests/qwen-eval/**
      - docker/codex-workspace/task-board/**
      - docker/codex-workspace/novel-board/**
      - docker/codex-workspace/recurring-events/**
      - docker/hermes-agent/skills/obsidian-task-board/**
      - tests/codex-workspace/**
      - docs/project_docs/BOXP-360/tools/**
      - .github/workflows/test-codex-task-board-runner.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  suites:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [runner-0, runner-1, localllm, remaining]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BABASHKA_VERSION: 1.12.218
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Babashka
        run: |
          set -eux
          tmp="$(mktemp -d)"
          curl --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 -fsSL \
            "https://github.com/babashka/babashka/releases/download/v${BABASHKA_VERSION}/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz" \
            -o "${tmp}/bb.tar.gz"
          tar -xzf "${tmp}/bb.tar.gz" -C "${tmp}"
          sudo install -m 0755 "$(find "${tmp}" -type f -name bb | head -n 1)" /usr/local/bin/bb
      - name: Check coverage and aggregate fixtures
        run: python3 tests/codex-workspace/ci-partition-test.py
      - name: Runner shard 0
        if: matrix.group == 'runner-0'
        run: TASK_BOARD_TEST_SHARDS=2 TASK_BOARD_TEST_SHARD=0 tests/codex-workspace/task-board-runner-test.sh
      - name: Runner shard 1
        if: matrix.group == 'runner-1'
        run: TASK_BOARD_TEST_SHARDS=2 TASK_BOARD_TEST_SHARD=1 tests/codex-workspace/task-board-runner-test.sh
      - name: Local LLM documentation
        if: matrix.group == 'localllm'
        run: tests/codex-workspace/localllm-docs-test.sh
      - name: Remaining suites
        if: matrix.group == 'remaining'
        run: |
          set -euo pipefail
          time python3 tests/codex-workspace/delegation-test.py
          time tests/codex-workspace/task-board-events-test.sh
          time tests/codex-workspace/ai-ops-ledger-test.sh
          time bash tests/codex-workspace/ai-subscription-usage-test.sh
          time bb tests/ai-observability/test_slo_snapshot.bb
          time docs/project_docs/BOXP-360/tools/test.sh
          time tests/codex-workspace/localllm-source-check-test.sh
          time bb docker/codex-workspace/novel-board/novel_board_runner.bb test
          time tests/codex-workspace/novel-board-runner-test.sh
          time tests/codex-workspace/recurring-events-test.sh
          time bb tests/codex-workspace/autonomy-policy-test.bb
          time bb tests/codex-workspace/autonomy-control-test.bb
          time bb tests/codex-workspace/vault-writer-test.bb

  test:
    timeout-minutes: 2
    if: always()
    needs: [suites]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every suite shard to succeed
        env:
          RESULT: ${{ needs.suites.result }}
        run: |
          test "$RESULT" = success
