worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  server {
    listen 8080;
    root /srv/www;
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location /kohako/api/ { client_max_body_size 1m; proxy_pass http://127.0.0.1:8787; }
    location ^~ /kohako/live2d/ { rewrite ^/kohako/live2d/(.*)$ /kohako/kohako/live2d/$1 last; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.wasm$ { types { application/wasm wasm; } add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.p2lrt$ { default_type application/octet-stream; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /kohako/ { try_files $uri $uri/ =404; }
  }
}
