worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  server {
    listen 8080;
    root /srv/www;
    # 試作候補: API は通常の /kohako/api/ へ、モデル v11r・runtime・静止表情は通常版と同じ blob（fetch.sh で検証）を共用する。
    # 候補ごとの JS と acting 素材は /kohako/candidates/<id>/ 配下の別ファイルで、通常版と混ざらない。
    location ~ ^/kohako/candidates/[a-z0-9-]+/api/ { rewrite ^/kohako/candidates/[a-z0-9-]+/(api/.*)$ /kohako/$1 last; }
    location ~ ^/kohako/candidates/[a-z0-9-]+/kohako/(live2d/sample/[^/]+|live2d/kohako/kohako-full-v11r\.p2lrt|studio/[^/]+)$ { rewrite ^/kohako/candidates/[a-z0-9-]+/kohako/(.*)$ /kohako/kohako/$1 last; }
    location = /kohako/candidates/index.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # BOXP-500 TD-01: kohako-home.b0xp.io のルートから家へ。API は頁相対なので /kohako/ 配下へ移す。
    location = / { absolute_redirect off; return 302 /kohako/home.html; }
    location = /kohako/sw.js { alias /srv/www/kohako/kohako/sw.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
    location = /kohako/manifest.webmanifest { alias /srv/www/kohako/kohako/manifest.webmanifest; default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location /kohako/api/ { client_max_body_size 1m; proxy_pass http://127.0.0.1:8787; }
    location ^~ /kohako/live2d/ { rewrite ^/kohako/live2d/(.*)$ /kohako/kohako/live2d/$1 last; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.wasm$ { types { application/wasm wasm; } add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.p2lrt$ { default_type application/octet-stream; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /kohako/ { try_files $uri $uri/ =404; }
  }
}
