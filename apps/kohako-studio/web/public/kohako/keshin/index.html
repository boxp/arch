<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keshin2D</title>
<meta name="description" content="キャラクターの絵を、ブラウザで動かす 2D アバター。マウス・Web カメラ・マイクで動かせます。">
<!-- リンクを貼ったときに出る、見出しと絵（デモのページ用。別の場所に置くときは、og:image の URL を、その場所のものに替える） -->
<meta property="og:type" content="website">
<meta property="og:title" content="Keshin2D（化身 2D）">
<meta property="og:description" content="キャラクターの絵を、ブラウザで動かす 2D アバター">
<meta property="og:image" content="https://rotejin.github.io/Keshin2D/docs/images/social_preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23b9a3f0%22/%3E%3Ccircle cx=%2211%22 cy=%2215%22 r=%222.5%22 fill=%22%23333%22/%3E%3Ccircle cx=%2221%22 cy=%2215%22 r=%222.5%22 fill=%22%23333%22/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --panel: rgba(21, 22, 28, .94); --card: rgba(255, 255, 255, .035); --line: #353846; --line2: #474a5a;
          --text: #eceef4; --dim: #9aa0b2; --btn: #2a2c37; --btnh: #343746; --accent: #6c8dff; --accent2: #8aa3ff; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.55 "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; color: var(--text); }
  body.bg-transparent { background: transparent; }
  body.bg-green { background: #00ff00; }
  body.bg-white { background: #ffffff; }
  body.bg-dark { background: #23242b; }
  body.bg-room { background: linear-gradient(#cfe3f5, #f6efe6); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- 操作パネル（左の縦長）。上から: ふだん使う物 → 好みに合わせる → キャラを作る人向け */
  #ui { position: absolute; top: 10px; left: 10px; width: 304px; max-height: calc(100% - 20px); overflow: auto; scrollbar-width: thin;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; box-sizing: border-box;
        box-shadow: 0 10px 34px rgba(0, 0, 0, .28); backdrop-filter: blur(8px); }
  .uihead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .brand { font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  .brand small { font-weight: 400; color: var(--dim); margin-left: 6px; font-size: 11px; }
  /* モデルを選ぶ欄（models/index.json に 2 体以上あるときだけ、名前の表示の代わりに出る） */
  #modelsel { flex: 1; min-width: 0; margin: 0 8px; padding: 3px 6px; font-size: 12px; }
  #modelsel option { background: #2a2c37; color: var(--text); }
  #ui h2 { font-size: 11px; margin: 14px 0 6px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
  #ui h2:first-of-type { margin-top: 0; }
  #ui h3 { font-size: 12px; margin: 14px 0 6px; color: #cfd3e0; font-weight: 600; padding-top: 10px; border-top: 1px solid var(--line); }
  #ui .blk:first-child h3 { margin-top: 0; padding-top: 0; border-top: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; color: inherit; background: var(--btn); border: 1px solid var(--line2); border-radius: 8px; padding: 5px 11px; cursor: pointer;
                   transition: background .12s, border-color .12s; }
  button:hover { background: var(--btnh); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { background: transparent; border-color: transparent; color: var(--dim); padding: 3px 8px; }
  button.ghost:hover { background: var(--btn); color: var(--text); }
  button.wide { width: 100%; }
  kbd { font: 10px/1 Consolas, monospace; color: var(--dim); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 4px; margin-left: 5px; }
  button.on kbd { color: #dfe6ff; border-color: rgba(255, 255, 255, .45); }

  /* 動かし方: 3 つ並びの切り替え */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 7px 4px; background: var(--btn); }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--accent); }
  #camopts { margin-top: 6px; color: var(--dim); }
  body:not(.mode-camera) #camopts { display: none; }
  #status { color: var(--dim); margin-top: 6px; min-height: 1.55em; font-size: 12px; }

  /* マイク: 入れると、右に音の大きさが出る */
  #micmeter { flex: 1; height: 6px; min-width: 60px; background: var(--btn); border-radius: 3px; overflow: hidden; }
  #micmeter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5fd0a0, #b6e36a); transition: width .08s linear; }
  #micvowel { width: 1.4em; text-align: center; color: var(--dim); }
  label.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }

  /* 表情 */
  #exprs .more { display: none; margin-top: 6px; }
  #exprs.open .more { display: flex; }
  #exprs button { padding: 4px 9px; }

  /* 背景: 色の丸 */
  .sw { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid var(--line2); position: relative; }
  .sw.on { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(108, 141, 255, .35); background-color: transparent; }
  .sw[data-bg=room] { background: linear-gradient(#cfe3f5, #f6efe6); }
  .sw[data-bg=dark] { background: #23242b; }
  .sw[data-bg=white] { background: #fff; }
  .sw[data-bg=green] { background: #00ff00; }
  .sw[data-bg=transparent] { background: conic-gradient(#bbb 25%, #eee 0 50%, #bbb 0 75%, #eee 0) 0 0 / 12px 12px; }

  label.sl { display: grid; grid-template-columns: 104px 1fr 40px; gap: 6px; align-items: center; margin: 2px 0; }
  label.sl span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  /* 「好みに合わせる」のスライダーは、名前と値を上に、つまみを下に、幅いっぱいで置く（細かく動かしやすいように） */
  #prefs label.sl { grid-template-columns: 1fr auto; row-gap: 1px; margin: 7px 0 9px; align-items: baseline; }
  #prefs label.sl input[type=range] { grid-column: 1 / -1; grid-row: 2; margin: 0; }
  #prefs label.sl span:last-child { color: var(--accent2); }
  #dirs { justify-content: center; }
  button.mini { padding: 2px 8px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .hint { color: var(--dim); margin-top: 5px; font-size: 12px; }
  .hint button { margin-left: 4px; }

  /* 折りたたみ */
  .sec { border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; background: var(--card); }
  .sec > .sechead { display: block; width: 100%; text-align: left; border: 0; border-radius: 10px; background: transparent; padding: 8px 11px; font-weight: 600; color: #d6d9e6; }
  .sec > .sechead::before { content: "▸ "; color: var(--dim); }
  .sec > .sechead small { font-weight: 400; color: var(--dim); margin-left: 6px; }
  .sec.open > .sechead { border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; color: #fff; }
  .sec.open > .sechead::before { content: "▾ "; }
  .sec > .secbody { display: none; padding: 10px 11px 12px; }
  .sec.open > .secbody { display: block; }
  .sec .sec { background: rgba(0, 0, 0, .16); }
  .sec.main { margin-top: 14px; }
  .foot { margin-top: 12px; }

  #cam { position: absolute; right: 10px; bottom: 10px; width: 200px; border-radius: 10px; transform: scaleX(-1); display: none; }
  /* パネルを隠したあと、マウスを動かすと、隅に「出す」ボタンが出る（URL の ui=0 で開いたときは、出さない） */
  #showui { position: absolute; top: 10px; left: 10px; width: 36px; height: 36px; padding: 0; border-radius: 50%; display: none; font-size: 16px;
            background: var(--panel); border: 1px solid var(--line); }
  body:not(.mode-manual) #dirback { display: none; }   /* 「止めるのをやめる」は、向きを手で止めているときだけ */
  body.noui #ui, body.noui #cam { display: none !important; }
  body.noui.peek:not(.pure) #showui { display: block; }
</style>
</head>
<body class="bg-room">
<canvas id="view"></canvas>
<video id="cam" playsinline muted></video>
<div id="ui">
  <div class="uihead">
    <span class="brand">Keshin2D<small id="modelname"></small></span>
    <select id="modelsel" title="モデルを切り替えます" hidden></select>
    <button id="hide" class="ghost" title="パネルを隠す（H キーでも切り替え）">隠す ✕</button>
  </div>

  <h2>動かし方</h2>
  <div class="seg" id="modes">
    <button data-mode="mouse" title="カーソルの方を向きます">マウス</button>
    <button data-mode="camera" title="Web カメラで、顔の動きに合わせます">カメラ</button>
    <button data-mode="demo" title="ひとり芝居を、くり返し再生します">おまかせ</button>
  </div>
  <div class="row" id="camopts"><label class="chk"><input type="checkbox" id="mirror" checked> 鏡写し（自分が右を向くと、画面でも右へ）</label></div>
  <div id="status"></div>

  <h2>声と口</h2>
  <div class="row">
    <label class="chk"><input type="checkbox" id="mic"> マイクで口パク</label>
    <div id="micmeter" title="マイクの音の大きさ"><i></i></div><span id="micvowel"></span>
  </div>
  <div class="row" id="demos" style="margin-top:6px"></div>

  <h2>表情</h2>
  <div id="exprs"><div class="row favs"></div><div class="row more"></div></div>
  <div class="hint"><button id="exprtoggle" class="ghost">▸ ほかの表情</button></div>

  <h2>背景と配置</h2>
  <div class="row" id="bgs">
    <button class="sw" data-bg="room" title="明るい色"></button>
    <button class="sw" data-bg="dark" title="暗い色"></button>
    <button class="sw" data-bg="white" title="白"></button>
    <button class="sw" data-bg="green" title="緑（クロマキー）"></button>
    <button class="sw" data-bg="transparent" title="透過（OBS のブラウザソース用）"></button>
  </div>
  <div class="hint">画面をドラッグで位置、ホイールで大きさ。<button id="viewreset" class="ghost">配置を戻す</button></div>

  <div class="sec main" data-sec="prefs"><button class="sechead">好みに合わせる<small>動き・向きの上限・口</small></button><div class="secbody" id="prefs">
    <div class="blk" id="p_feel"></div>
    <div class="blk" id="p_limits"></div>
    <div class="blk" id="p_lip"></div>
    <div class="blk" id="vowels"></div>
    <div class="blk" id="p_reset"></div>
  </div></div>

  <div class="sec" data-sec="author"><button class="sechead">キャラを作る人向け<small>細かい値と書き出し</small></button><div class="secbody" id="author">
    <div class="hint" style="margin-top:0">キャラの初期値を決めるための項目です。ふだん使うだけなら、開かなくてかまいません。</div>
    <div class="row" style="margin-top:8px"><label class="chk"><input type="checkbox" id="hair"> 髪を表示（外すと、顔の確認用）</label></div>
    <div class="sec" data-sec="manual"><button class="sechead">手で動かす（表情・向き・口）</button><div class="secbody" id="sliders"></div></div>
    <div class="sec" data-sec="tune"><button class="sechead">顔の動き・髪の揺れ（くわしく）</button><div class="secbody" id="tune"></div></div>
    <div id="sections"></div>
  </div></div>

  <div class="foot"><button id="obsurl" class="wide" title="今の配置・背景・動かし方・好みの値を入れた URL を作ります">OBS 用の URL をコピー</button></div>
  <div id="obsmsg" class="hint"></div>
</div>
<button id="showui" title="パネルを出す（H キーでも切り替え）">☰</button>
<!-- エンジンの js は、開くたびに新しい版を取りに行く（?v= に今の時刻。avatar.js は、同じ印を、あとから読み込む js にも付ける）。
     印が無いと、ブラウザが前の版をしまったまま使い、直したエンジンが効かないことがある -->
<script type="module">import('./js/avatar.js?v=' + Date.now());</script>
</body>
</html>
